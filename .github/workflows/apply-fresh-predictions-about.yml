name: Apply fresh predictions and About page

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/fresh-ai-predictions-about-page'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fresh-ai-predictions-about-page
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply fresh prediction and About changes
        run: node scripts/apply-fresh-predictions-about-page.mjs
      - name: Check syntax and behavior
        run: |
          node --check prediction-ai-controller.js
          node --check site-footer.js
          node tests/prediction-share-v2.test.js
      - name: Commit applied changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prediction-ai-controller.js index.html tests/prediction-share-v2.test.js
          if ! git diff --cached --quiet; then
            git commit -m "Refresh AI predictions and link system About page"
            git push origin HEAD:agent/fresh-ai-predictions-about-page
          fi

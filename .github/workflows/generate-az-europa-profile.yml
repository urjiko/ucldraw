name: Finalize AZ Europa home profile

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  finalize:
    if: github.head_ref == 'agent/add-az-europa-home-profile'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/add-az-europa-home-profile
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Lock AZ regression values and documentation
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          function replaceChecked(text, before, after, label) {
            if (!text.includes(before)) throw new Error(`Missing replacement target: ${label}`);
            return text.replace(before, after);
          }

          let test = fs.readFileSync('tests/home-advantage-model.test.js', 'utf8');
          test = replaceChecked(test,
            "assert.equal(records.length, 666, 'Stored source archive must contain 666 home matches.');",
            "assert.equal(records.length, 683, 'Stored source archive must contain 683 home matches.');",
            'archive count');
          test = replaceChecked(test,
            "assert.equal(records.filter((match) => match.competitionType === 'domestic').length, 651);",
            "assert.equal(records.filter((match) => match.competitionType === 'domestic').length, 668);",
            'domestic archive count');
          test = replaceChecked(test,
            "  'bayern', 'bvb', 'feyenoord', 'leipzig', 'lens', 'lille', 'porto', 'psg',\n  'psv', 'sporting', 'stuttgart'",
            "  'azalkmaar', 'bayern', 'bvb', 'feyenoord', 'leipzig', 'lens', 'lille', 'porto',\n  'psg', 'psv', 'sporting', 'stuttgart'",
            '17-match team list');
          test = replaceChecked(test,
            "assert.equal(generated.sourceSummary.storedMatches, 666);\nassert.equal(generated.sourceSummary.matches, 554);\nassert.equal(generated.sourceSummary.excludedStoredMatches, 112);\nassert.equal(generated.sourceSummary.teams, 29);",
            "assert.equal(generated.sourceSummary.storedMatches, 683);\nassert.equal(generated.sourceSummary.matches, 571);\nassert.equal(generated.sourceSummary.excludedStoredMatches, 112);\nassert.equal(generated.sourceSummary.teams, 30);",
            'generated summary counts');
          test = replaceChecked(test,
            "assert.equal(generated.sourceSummary.domesticMatches, 542);",
            "assert.equal(generated.sourceSummary.domesticMatches, 559);",
            'active domestic count');
          test = replaceChecked(test,
            "  atleti: 1.1061,\n  barcelona: 1.18,",
            "  atleti: 1.1061,\n  azalkmaar: 0.9596,\n  barcelona: 1.18,",
            'AZ attack value');
          test = replaceChecked(test,
            "assert.equal(generated.profiles.atleti.attack.vsSimilar, 1.1184);\nassert.equal(generated.profiles.barcelona.attack.vsSimilar, 1.1055);",
            "assert.equal(generated.profiles.atleti.attack.vsSimilar, 1.1184);\nassert.equal(generated.profiles.azalkmaar.attack.overall, 0.9668);\nassert.equal(generated.profiles.azalkmaar.attack.vsSimilar, 0.9385);\nassert.equal(generated.profiles.azalkmaar.attack.vsWeaker, 0.9843);\nassert.equal(generated.profiles.barcelona.attack.vsSimilar, 1.1055);",
            'AZ context assertions');
          test = replaceChecked(test,
            "assert.equal(generated.researchQueue.length, 13);\nassert.equal(generated.researchQueue[0], 'azalkmaar');",
            "assert.equal(generated.researchQueue.length, 12);\nassert.equal(generated.researchQueue[0], 'bayerleverkusen');",
            'Europa queue');
          fs.writeFileSync('tests/home-advantage-model.test.js', test);

          let docs = fs.readFileSync('docs/home-advantage-model.md', 'utf8');
          docs = replaceChecked(docs,
            'The archive contains 666 verified home matches. The guaranteed-team filter currently includes 554 matches across 29 active profiles:',
            'The archive contains 683 verified home matches. The guaranteed-team filter currently includes 571 matches across 30 active profiles:',
            'documentation counts');
          docs = replaceChecked(docs,
            '- Bayern München, Borussia Dortmund, Feyenoord, Lens, Lille, Paris Saint-Germain, Porto, PSV, RB Leipzig, Sporting CP, and VfB Stuttgart: 17 each;',
            '- AZ Alkmaar, Bayern München, Borussia Dortmund, Feyenoord, Lens, Lille, Paris Saint-Germain, Porto, PSV, RB Leipzig, Sporting CP, and VfB Stuttgart: 17 each;',
            'documentation AZ count');
          docs = replaceChecked(docs,
            'All 29 guaranteed Champions League clubs now have active profiles, so the research queue begins with guaranteed Europa League club AZ Alkmaar.',
            'All 29 guaranteed Champions League clubs have active profiles. AZ Alkmaar is the first completed guaranteed Europa League club, and the research queue now begins with Bayer Leverkusen.',
            'documentation queue');
          docs = replaceChecked(docs,
            "### Netherlands 2024/25\n\n`feyenoord-psv-2024-25.json` contains all 34 Eredivisie home matches for Feyenoord and PSV, 17 per club.",
            "### Netherlands 2024/25\n\n`feyenoord-psv-2024-25.json` contains all 34 Eredivisie home matches for Feyenoord and PSV, 17 per club. `azalkmaar-2024-25.json` adds all 17 AZ Alkmaar home matches as the first guaranteed Europa League profile.",
            'AZ Netherlands documentation');
          docs = replaceChecked(docs,
            "| Feyenoord | 1.0988 | Similar opponents: 1.0202 |\n| PSV | 1.1800 | Similar opponents: 1.0140 |",
            "| AZ Alkmaar | 0.9596 | Similar opponents: 0.9385 |\n| Feyenoord | 1.0988 | Similar opponents: 1.0202 |\n| PSV | 1.1800 | Similar opponents: 1.0140 |",
            'AZ documentation table');
          docs = replaceChecked(docs,
            'PSV reaches the conservative attack ceiling, while Feyenoord remains below it with an overall attack residual of `1.0812`.',
            'AZ scores slightly below its coefficient baseline, with an overall attack residual of `0.9668` and a weaker-opponent value of `0.9843`. PSV reaches the conservative attack ceiling, while Feyenoord remains below it with an overall attack residual of `1.0812`.',
            'AZ interpretation');
          fs.writeFileSync('docs/home-advantage-model.md', docs);
          NODE
      - name: Commit finalized AZ profile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/generate-az-europa-profile.yml
          git add tests/home-advantage-model.test.js docs/home-advantage-model.md
          git commit -m "Finalize AZ Europa home profile"
          git push origin HEAD:agent/add-az-europa-home-profile

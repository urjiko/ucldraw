name: Generate Brugge profile snapshot

on:
  push:
    branches:
      - agent/add-club-brugge-home-profile

permissions:
  contents: write

jobs:
  generate:
    if: ${{ !contains(github.event.head_commit.message, '[profile snapshot]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Regenerate profile snapshot
        run: node scripts/build-home-advantage-profiles.mjs
      - name: Commit generated profile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add generated-home-advantage-profiles.js
          if ! git diff --cached --quiet; then
            git commit -m "Generate Club Brugge profile snapshot [profile snapshot]"
            git push
          fi

name: Generate Champions playoff home profiles

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    if: github.head_ref == 'agent/add-champions-playoff-home-profiles'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/add-champions-playoff-home-profiles
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Finalize playoff scope
        run: python scripts/finalize-champions-playoff-home-profiles.py
      - name: Run profile regression test
        run: node tests/home-advantage-model.test.js
      - name: Commit finalized playoff profiles
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/home-advantage-model.test.js docs/home-advantage-model.md
          if ! git diff --cached --quiet; then
            git commit -m "Lock Champions playoff home profile regressions"
            git push origin HEAD:agent/add-champions-playoff-home-profiles
          fi

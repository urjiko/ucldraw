name: Generate Champions playoff home profiles

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    if: github.head_ref == 'agent/add-champions-playoff-home-profiles'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/add-champions-playoff-home-profiles
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build Champions playoff home matches
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const vm = require('node:vm');

          (async () => {
            const updater = await import('./scripts/update-uefa-coefficients.mjs');
            const urls = {
              greece: 'https://raw.githubusercontent.com/openfootball/football.json/master/2024-25/gr.1.json',
              scotland: 'https://raw.githubusercontent.com/openfootball/football.json/master/2024-25/sco.1.json',
              austria: 'https://raw.githubusercontent.com/openfootball/football.json/master/2024-25/at.1.json',
              norway: 'https://raw.githubusercontent.com/openfootball/europe/master/norway/2024_no1.txt',
              coefficients: updater.SOURCE_URL
            };
            const responses = Object.fromEntries(await Promise.all(Object.entries(urls).map(async ([key, url]) => {
              const response = await fetch(url, { headers: { 'user-agent': 'UEFA-home-profile-builder/1.0' } });
              if (!response.ok) throw new Error(`${key} source request failed: ${response.status}`);
              return [key, response];
            })));

            const [greece, scotland, austria, norway, coefficientHtml] = await Promise.all([
              responses.greece.json(),
              responses.scotland.json(),
              responses.austria.json(),
              responses.norway.text(),
              responses.coefficients.text()
            ]);
            const rankingRows = updater.parseKassiesaRows(coefficientHtml);
            if (rankingRows.length < 300) throw new Error(`Expected full coefficient ranking, received ${rankingRows.length} rows.`);

            const coefficientContext = { window: {}, Object };
            vm.runInNewContext(fs.readFileSync('generated-club-coefficients.js', 'utf8'), coefficientContext);
            const generatedCoefficients = coefficientContext.window.UCLDRAW_CLUB_COEFFICIENTS.clubs;

            const floors = Object.fromEntries(['GRE', 'SCO', 'AUT', 'NOR'].map((country) => {
              const values = rankingRows.filter((row) => row.country === country).map((row) => row.countryPart).filter(Number.isFinite);
              if (!values.length) throw new Error(`No association floor found for ${country}.`);
              return [country, Math.max(...values)];
            }));

            const teamAliases = {
              'AEK Athen': { slug: 'aek', name: 'AEK Athens', aliases: ['AEK Athens'] },
              'Olympiakos Piraeus': { slug: 'olympiacos', name: 'Olympiakos Piraeus', aliases: ['Olympiakos Piraeus'] },
              'PAOK Saloniki': { slug: 'paok', name: 'PAOK Thessaloniki', aliases: ['PAOK Thessaloniki'] },
              'Panathinaikos': { slug: 'panathinaikos', name: 'Panathinaikos', aliases: ['Panathinaikos'] },
              'OFI Heraklion': { slug: 'crete', name: 'OFI Crete', aliases: ['OFI Crete', 'OFI Heraklion'] },
              'Aris Saloniki': { name: 'Aris Thessaloniki', aliases: ['Aris Thessaloniki', 'Aris Saloniki'] },
              'Celtic FC': { slug: 'celtic', name: 'Celtic', aliases: ['Celtic'] },
              'Rangers FC': { slug: 'rangers', name: 'Rangers', aliases: ['Glasgow Rangers', 'Rangers'] },
              'Hibernian FC': { slug: 'hibernian', name: 'Hibernian', aliases: ['Hibernian'] },
              'Heart of Midlothian': { slug: 'hearts', name: 'Heart of Midlothian', aliases: ['Heart of Midlothian'] },
              'LASK': { slug: 'lask', name: 'LASK', aliases: ['LASK'] },
              'RB Salzburg': { slug: 'salzburg', name: 'RB Salzburg', aliases: ['FC Salzburg', 'Salzburg'] },
              'Sturm Graz': { slug: 'strumgraz', name: 'Sturm Graz', aliases: ['Sturm Graz'] },
              'Rapid Wien': { slug: 'rapid', name: 'Rapid Wien', aliases: ['Rapid Wien'] },
              'Austria Wien': { slug: 'austriawien', name: 'Austria Wien', aliases: ['Austria Wien'] },
              'Viking FK': { slug: 'viking', name: 'Viking', aliases: ['Viking Stavanger', 'Viking FK'] },
              'FK Bodø/Glimt': { slug: 'bodo', name: 'Bodø/Glimt', aliases: ['Bodø/Glimt', 'Bodo/Glimt'] },
              'SK Brann': { slug: 'brann', name: 'Brann', aliases: ['SK Brann Bergen', 'Brann Bergen', 'SK Brann'] },
              'Tromsø IL': { slug: 'tromso', name: 'Tromsø', aliases: ['Tromsø IL', 'Tromso IL'] },
              'Lillestrøm SK': { slug: 'lillestrom', name: 'Lillestrøm', aliases: ['Lillestrøm SK', 'Lillestrom SK'] }
            };

            function simpleSlug(value) {
              return String(value).normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase()
                .replace(/\b(?:fc|afc|fk|bk|sk|sc|ac|cf|nfc|if|il)\b/g, '')
                .replace(/[^a-z0-9]+/g, '') || 'unknown';
            }

            function team(sourceName, country, targetSlug = null) {
              const configured = teamAliases[sourceName] || {};
              return {
                slug: targetSlug || configured.slug || simpleSlug(sourceName),
                name: configured.name || sourceName.replace(/\s+(?:FC|AFC|FK|BK|SK|SC|AC|CF|IF|IL)$/i, ''),
                country,
                aliases: configured.aliases || [sourceName]
              };
            }

            function coefficientFor(candidate) {
              if (candidate.slug && Number.isFinite(Number(generatedCoefficients[candidate.slug]?.coefficient))) {
                return Number(generatedCoefficients[candidate.slug].coefficient);
              }
              const normalized = new Set(candidate.aliases.map((name) => updater.normalize(name)));
              const row = rankingRows.find((entry) => entry.country === candidate.country && normalized.has(updater.normalize(entry.officialName)));
              return row ? row.coefficient : floors[candidate.country];
            }

            const targets = new Map([
              ['AEK Athen', { slug: 'aek', country: 'GRE', competition: 'Greek Super League 2024/25' }],
              ['Celtic FC', { slug: 'celtic', country: 'SCO', competition: 'Scottish Premiership 2024/25' }],
              ['LASK', { slug: 'lask', country: 'AUT', competition: 'Austrian Bundesliga 2024/25' }],
              ['Viking FK', { slug: 'viking', country: 'NOR', competition: 'Norwegian Eliteserien 2024' }]
            ]);
            const records = [];

            function addRecord({ date, homeSource, awaySource, homeGoals, awayGoals, target }) {
              const home = team(homeSource, target.country, target.slug);
              const away = team(awaySource, target.country);
              records.push({
                date,
                competitionType: 'domestic',
                competition: target.competition,
                homeSlug: home.slug,
                homeName: home.name,
                homeCountry: home.country,
                awaySlug: away.slug,
                awayName: away.name,
                awayCountry: away.country,
                homeCoefficient: coefficientFor(home),
                awayCoefficient: coefficientFor(away),
                homePot: 1,
                awayPot: 1,
                potCount: 1,
                homeGoals: Number(homeGoals),
                awayGoals: Number(awayGoals),
                sourceKey: `openfootball-${target.country.toLowerCase()}-2024-25`
              });
            }

            for (const source of [greece, scotland, austria]) {
              if (!Array.isArray(source.matches) || !source.matches.length) throw new Error(`${source.name || 'JSON league'} has no matches.`);
              for (const match of source.matches) {
                const target = targets.get(match.team1);
                if (!target) continue;
                const score = match.score?.ft;
                if (!Array.isArray(score) || score.length !== 2) throw new Error(`Missing FT score: ${match.date} ${match.team1} v ${match.team2}`);
                addRecord({ date: match.date, homeSource: match.team1, awaySource: match.team2, homeGoals: score[0], awayGoals: score[1], target });
              }
            }

            const monthIndex = { Jan: 0, Feb: 1, Mar: 2, Apr: 3, May: 4, Jun: 5, Jul: 6, Aug: 7, Sep: 8, Oct: 9, Nov: 10, Dec: 11 };
            let currentYear = 2024;
            let previousMonth = null;
            let currentDate = null;
            let norwayMatchCount = 0;
            for (const line of norway.split(/\r?\n/)) {
              const dateMatch = line.match(/^\s*(?:Mon|Tue|Wed|Thu|Fri|Sat|Sun)\s+([A-Z][a-z]{2})\s+(\d{1,2})(?:\s+(\d{4}))?\s*$/);
              if (dateMatch) {
                const month = monthIndex[dateMatch[1]];
                if (dateMatch[3]) currentYear = Number(dateMatch[3]);
                else if (previousMonth !== null && month < previousMonth - 6) currentYear += 1;
                previousMonth = month;
                currentDate = `${currentYear}-${String(month + 1).padStart(2, '0')}-${String(Number(dateMatch[2])).padStart(2, '0')}`;
                continue;
              }
              const result = line.match(/^\s*(?:\d{2}:\d{2}\s+)?(.+?)\s+v\s+(.+?)\s+(\d+)-(\d+)(?:\s+\([^)]*\))?(?:\s+\[[^\]]+\])?\s*$/);
              if (!result || !currentDate) continue;
              norwayMatchCount += 1;
              const target = targets.get(result[1].trim());
              if (!target) continue;
              addRecord({ date: currentDate, homeSource: result[1].trim(), awaySource: result[2].trim(), homeGoals: result[3], awayGoals: result[4], target });
            }
            if (norwayMatchCount !== 240) throw new Error(`Expected 240 Norwegian matches, received ${norwayMatchCount}.`);

            records.sort((left, right) => left.date.localeCompare(right.date) || left.homeSlug.localeCompare(right.homeSlug));
            const expected = { aek: 16, celtic: 19, lask: 18, viking: 15 };
            for (const [slug, count] of Object.entries(expected)) {
              const actual = records.filter((record) => record.homeSlug === slug).length;
              if (actual !== count) throw new Error(`Expected ${count} ${slug} home matches, received ${actual}.`);
            }
            if (records.length !== 68) throw new Error(`Expected 68 Champions playoff home matches, received ${records.length}.`);

            fs.writeFileSync('data/home-advantage-matches/aek-celtic-lask-viking-2024-25.json', `${JSON.stringify(records)}\n`);

            const builderPath = 'scripts/build-home-advantage-profiles.mjs';
            let builder = fs.readFileSync(builderPath, 'utf8');
            const oldPriorities = `  const priorities = [\n    { competition: 'champions', stage: 'guaranteed' },\n    { competition: 'europa', stage: 'guaranteed' }\n  ];`;
            const newPriorities = `  const priorities = [\n    { competition: 'champions', stage: 'guaranteed' },\n    { competition: 'europa', stage: 'guaranteed' },\n    { competition: 'champions', stage: 'playoffs' }\n  ];`;
            if (!builder.includes(newPriorities)) {
              if (!builder.includes(oldPriorities)) throw new Error('Priority scope block changed unexpectedly.');
              builder = builder.replace(oldPriorities, newPriorities);
            }
            builder = builder.replace('Guaranteed Champions/Europa scope contains a duplicate team slug.', 'Active home-advantage scope contains a duplicate team slug.');
            fs.writeFileSync(builderPath, builder);

            console.log(JSON.stringify({ counts: expected, floors, stored: records.length }));
          })().catch((error) => {
            console.error(error);
            process.exitCode = 1;
          });
          NODE
      - name: Regenerate profile payload
        run: node scripts/build-home-advantage-profiles.mjs
      - name: Commit verified Champions playoff profiles
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/home-advantage-matches/aek-celtic-lask-viking-2024-25.json scripts/build-home-advantage-profiles.mjs generated-home-advantage-profiles.js
          if ! git diff --cached --quiet; then
            git commit -m "Generate Champions playoff home profiles"
            git push origin HEAD:agent/add-champions-playoff-home-profiles
          fi

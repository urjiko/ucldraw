name: Finalize English Europa home profiles

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  finalize:
    if: github.head_ref == 'agent/add-bournemouth-palace-europa-profiles'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/add-bournemouth-palace-europa-profiles
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Lock English Europa regression values and documentation
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          function replaceChecked(text, before, after, label) {
            if (!text.includes(before)) throw new Error(`Missing replacement target: ${label}`);
            return text.replace(before, after);
          }

          let test = fs.readFileSync('tests/home-advantage-model.test.js', 'utf8');
          test = replaceChecked(test,
            "assert.equal(records.length, 717, 'Stored source archive must contain 717 home matches.');",
            "assert.equal(records.length, 755, 'Stored source archive must contain 755 home matches.');",
            'archive count');
          test = replaceChecked(test,
            "assert.equal(records.filter((match) => match.competitionType === 'domestic').length, 702);",
            "assert.equal(records.filter((match) => match.competitionType === 'domestic').length, 740);",
            'domestic archive count');
          test = replaceChecked(test,
            "  'arsenal', 'astonvilla', 'atleti', 'barcelona', 'city', 'como', 'inter',\n  'liverpool', 'manu', 'napoli', 'real', 'realbetis', 'roma', 'villareal'",
            "  'arsenal', 'astonvilla', 'atleti', 'barcelona', 'bournemouth', 'city', 'como',\n  'crystalpalace', 'inter', 'liverpool', 'manu', 'napoli', 'real', 'realbetis',\n  'roma', 'villareal'",
            '19-match team list');
          test = replaceChecked(test,
            "assert.equal(generated.sourceSummary.storedMatches, 717);\nassert.equal(generated.sourceSummary.matches, 605);\nassert.equal(generated.sourceSummary.excludedStoredMatches, 112);\nassert.equal(generated.sourceSummary.teams, 32);",
            "assert.equal(generated.sourceSummary.storedMatches, 755);\nassert.equal(generated.sourceSummary.matches, 643);\nassert.equal(generated.sourceSummary.excludedStoredMatches, 112);\nassert.equal(generated.sourceSummary.teams, 34);",
            'generated summary counts');
          test = replaceChecked(test,
            "assert.equal(generated.sourceSummary.domesticMatches, 593);",
            "assert.equal(generated.sourceSummary.domesticMatches, 631);",
            'active domestic count');
          test = replaceChecked(test,
            "  bayern: 1.18,\n  brugge: 1.1168,",
            "  bayern: 1.18,\n  bournemouth: 0.9345,\n  brugge: 1.1168,",
            'Bournemouth attack value');
          test = replaceChecked(test,
            "  como: 1.062,\n  feyenoord: 1.0988,",
            "  como: 1.062,\n  crystalpalace: 0.9824,\n  feyenoord: 1.0988,",
            'Palace attack value');
          test = replaceChecked(test,
            "assert.equal(generated.profiles.bayerleverkusen.defense.vsSimilar, 1.1277);\nassert.equal(generated.profiles.brugge.attack.overall, 1.0974);",
            "assert.equal(generated.profiles.bayerleverkusen.defense.vsSimilar, 1.1277);\nassert.equal(generated.profiles.bournemouth.attack.overall, 0.9456);\nassert.equal(generated.profiles.bournemouth.attack.vsStronger, 0.9967);\nassert.equal(generated.profiles.bournemouth.attack.vsSimilar, 0.9308);\nassert.equal(generated.profiles.bournemouth.defense.overall, 0.8754);\nassert.equal(generated.profiles.bournemouth.defense.domestic, 0.8499);\nassert.equal(generated.profiles.bournemouth.defense.vsStronger, 0.9156);\nassert.equal(generated.profiles.bournemouth.defense.vsSimilar, 0.8825);\nassert.equal(generated.profiles.brugge.attack.overall, 1.0974);",
            'Bournemouth context assertions');
          test = replaceChecked(test,
            "assert.equal(generated.profiles.como.attack.vsStronger, 1.0466);\nassert.equal(generated.profiles.feyenoord.attack.overall, 1.0812);",
            "assert.equal(generated.profiles.como.attack.vsStronger, 1.0466);\nassert.equal(generated.profiles.crystalpalace.attack.overall, 0.9854);\nassert.equal(generated.profiles.crystalpalace.attack.vsStronger, 1.1448);\nassert.equal(generated.profiles.crystalpalace.attack.vsSimilar, 0.9192);\nassert.equal(generated.profiles.crystalpalace.defense.domestic, 1.1096);\nassert.equal(generated.profiles.feyenoord.attack.overall, 1.0812);",
            'Palace context assertions');
          test = replaceChecked(test,
            "assert.equal(generated.researchQueue.length, 10);\nassert.equal(generated.researchQueue[0], 'bournemouth');",
            "assert.equal(generated.researchQueue.length, 8);\nassert.equal(generated.researchQueue[0], 'celtavigo');",
            'Europa queue');
          fs.writeFileSync('tests/home-advantage-model.test.js', test);

          let docs = fs.readFileSync('docs/home-advantage-model.md', 'utf8');
          docs = replaceChecked(docs,
            'The archive contains 717 verified home matches. The guaranteed-team filter currently includes 605 matches across 32 active profiles:',
            'The archive contains 755 verified home matches. The guaranteed-team filter currently includes 643 matches across 34 active profiles:',
            'documentation counts');
          docs = replaceChecked(docs,
            '- Arsenal, Aston Villa, Atlético Madrid, Barcelona, Como, Internazionale, Liverpool, Manchester City, Manchester United, Napoli, Real Betis, Real Madrid, Roma, and Villarreal: 19 each;',
            '- Arsenal, Aston Villa, Atlético Madrid, Barcelona, Bournemouth, Como, Crystal Palace, Internazionale, Liverpool, Manchester City, Manchester United, Napoli, Real Betis, Real Madrid, Roma, and Villarreal: 19 each;',
            'documentation English Europa counts');
          docs = replaceChecked(docs,
            'AZ Alkmaar, Bayer Leverkusen, and Hoffenheim are completed guaranteed Europa League clubs, and the research queue now begins with Bournemouth.',
            'AZ Alkmaar, Bayer Leverkusen, Bournemouth, Crystal Palace, and Hoffenheim are completed guaranteed Europa League clubs, and the research queue now begins with Celta Vigo.',
            'documentation queue');
          docs = replaceChecked(docs,
            "| Manchester United | 0.8400 |\n\n### Spain and Germany 2024/25",
            "| Manchester United | 0.8400 |\n\n`bournemouth-palace-2024-25.json` adds all 38 Premier League home matches for two guaranteed Europa League clubs, 19 per club.\n\n| Club | Domestic attack | Domestic visiting-goal multiplier |\n|---|---:|---:|\n| Bournemouth | 0.9345 | 0.8499 |\n| Crystal Palace | 0.9824 | 1.1096 |\n\nBournemouth scores below its coefficient baseline but shows a strong positive home defensive effect. Its attack values are `0.9967` against stronger opponents and `0.9308` against similar opponents. Crystal Palace is approximately neutral overall, rises to `1.1448` against stronger opponents, and falls to `0.9192` against similar opponents. Neither club has weaker-opponent observations under the current coefficient snapshot.\n\n### Spain and Germany 2024/25",
            'English Europa documentation');
          fs.writeFileSync('docs/home-advantage-model.md', docs);
          NODE
      - name: Commit finalized English Europa profiles
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/generate-england-europa-home-profiles.yml
          git add tests/home-advantage-model.test.js docs/home-advantage-model.md
          git commit -m "Finalize English Europa home profiles"
          git push origin HEAD:agent/add-bournemouth-palace-europa-profiles

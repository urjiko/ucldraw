name: Finalize guaranteed Champions profiles

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  finalize:
    if: github.head_ref == 'agent/complete-guaranteed-champions-home-profiles'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/complete-guaranteed-champions-home-profiles
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Lock final Champions regression values and documentation
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          function replaceChecked(text, before, after, label) {
            if (!text.includes(before)) throw new Error(`Missing replacement target: ${label}`);
            return text.replace(before, after);
          }

          let test = fs.readFileSync('tests/home-advantage-model.test.js', 'utf8');
          test = replaceChecked(test,
            "assert.equal(records.length, 633, 'Stored source archive must contain 633 home matches.');",
            "assert.equal(records.length, 666, 'Stored source archive must contain 666 home matches.');",
            'archive count');
          test = replaceChecked(test,
            "assert.equal(records.filter((match) => match.competitionType === 'domestic').length, 618);",
            "assert.equal(records.filter((match) => match.competitionType === 'domestic').length, 651);",
            'domestic archive count');
          test = replaceChecked(test,
            "assert.equal(records.filter((match) => match.homeSlug === 'brugge').length, 20);",
            "assert.equal(records.filter((match) => match.homeSlug === 'brugge').length, 20);\nassert.equal(records.filter((match) => match.homeSlug === 'shakhtar').length, 15);\nassert.equal(records.filter((match) => match.homeSlug === 'slavia').length, 18);",
            'final Champions match counts');
          test = replaceChecked(test,
            "assert.equal(generated.sourceSummary.storedMatches, 633);\nassert.equal(generated.sourceSummary.matches, 521);\nassert.equal(generated.sourceSummary.excludedStoredMatches, 112);\nassert.equal(generated.sourceSummary.teams, 27);",
            "assert.equal(generated.sourceSummary.storedMatches, 666);\nassert.equal(generated.sourceSummary.matches, 554);\nassert.equal(generated.sourceSummary.excludedStoredMatches, 112);\nassert.equal(generated.sourceSummary.teams, 29);",
            'generated summary counts');
          test = replaceChecked(test,
            "assert.equal(generated.sourceSummary.domesticMatches, 509);",
            "assert.equal(generated.sourceSummary.domesticMatches, 542);",
            'active domestic count');
          test = replaceChecked(test,
            "  roma: 1.017,\n  sporting: 1.1129,",
            "  roma: 1.017,\n  shakhtar: 1.1538,\n  slavia: 1.1747,\n  sporting: 1.1129,",
            'final Champions attack values');
          test = replaceChecked(test,
            "assert.equal(generated.profiles.roma.attack.vsWeaker, 1.0533);\nassert.equal(generated.profiles.sporting.attack.overall, 1.0927);",
            "assert.equal(generated.profiles.roma.attack.vsWeaker, 1.0533);\nassert.equal(generated.profiles.shakhtar.attack.overall, 1.1245);\nassert.equal(generated.profiles.shakhtar.attack.vsWeaker, 1.1538);\nassert.equal(generated.profiles.slavia.attack.overall, 1.1442);\nassert.equal(generated.profiles.slavia.attack.vsSimilar, 1.0413);\nassert.equal(generated.profiles.slavia.attack.vsWeaker, 1.1654);\nassert.equal(generated.profiles.slavia.defense.overall, 0.8419);\nassert.equal(generated.profiles.slavia.defense.domestic, 0.82);\nassert.equal(generated.profiles.sporting.attack.overall, 1.0927);",
            'final Champions context assertions');
          test = replaceChecked(test,
            "assert.equal(generated.researchQueue[0], 'shakhtar');\nassert.equal(generated.researchQueue[1], 'slavia');\nassert.equal(generated.researchQueue[2], 'azalkmaar');\nassert.equal(generated.researchQueue.at(-1), 'torreense');",
            "assert.equal(generated.researchQueue.length, 13);\nassert.equal(generated.researchQueue[0], 'azalkmaar');\nassert.equal(generated.researchQueue.at(-1), 'torreense');",
            'Europa-only research queue');
          fs.writeFileSync('tests/home-advantage-model.test.js', test);

          let docs = fs.readFileSync('docs/home-advantage-model.md', 'utf8');
          docs = replaceChecked(docs,
            'The archive contains 633 verified home matches. The guaranteed-team filter currently includes 521 matches across 27 active profiles:',
            'The archive contains 666 verified home matches. The guaranteed-team filter currently includes 554 matches across 29 active profiles:',
            'documentation counts');
          docs = replaceChecked(docs,
            '- Club Brugge: 20, including the championship play-off round.',
            '- Club Brugge: 20, including the championship play-off round;\n- Shakhtar Donetsk: 15;\n- Slavia Prague: 18, including the championship round.',
            'documentation final club counts');
          docs = replaceChecked(docs,
            'The remaining 112 archived records are retained but excluded from runtime generation. The next missing guaranteed Champions League club is Shakhtar Donetsk.',
            'The remaining 112 archived records are retained but excluded from runtime generation. All 29 guaranteed Champions League clubs now have active profiles, so the research queue begins with guaranteed Europa League club AZ Alkmaar.',
            'documentation completed scope');
          docs = replaceChecked(docs,
            "Porto remains below the attack ceiling and is approximately neutral against similar-strength opponents at `0.9779`. Its weaker-opponent visiting-goal multiplier is `0.8311`, a strong positive home defensive signal in that context. Sporting is also below the ceiling; its similar-opponent attack residual is `0.9754`, while the corresponding visiting-goal multiplier is `0.8817`.\n\n### Belgium 2024/25",
            "Porto remains below the attack ceiling and is approximately neutral against similar-strength opponents at `0.9779`. Its weaker-opponent visiting-goal multiplier is `0.8311`, a strong positive home defensive signal in that context. Sporting is also below the ceiling; its similar-opponent attack residual is `0.9754`, while the corresponding visiting-goal multiplier is `0.8817`.\n\n### Ukraine and Czechia 2024/25\n\n`shakhtar-slavia-2024-25.json` contains all 15 Shakhtar Donetsk Ukrainian Premier League home matches and all 18 Slavia Prague Czech First League home matches. Slavia's records include its three championship-round home fixtures. Ukrainian opponents without a higher individual coefficient use the `5.182` association floor; Czech opponents use `9.705`.\n\n| Club | Domestic attack | Notable context |\n|---|---:|---:|\n| Shakhtar Donetsk | 1.1538 | Weaker opponents: 1.1538 |\n| Slavia Prague | 1.1747 | Domestic visiting-goal multiplier: 0.8200 |\n\nAll Shakhtar league opponents fall into the weaker-opponent bucket under the current coefficient snapshot, so no unsupported similar- or stronger-opponent effect is emitted. Slavia remains just below the attack ceiling and combines that signal with a visiting-goal multiplier at the conservative `0.82` floor. Its similar-opponent attack value is `1.0413`, while the broader weaker-opponent attack value is `1.1654`.\n\n### Belgium 2024/25",
            'Ukraine and Czechia documentation');
          fs.writeFileSync('docs/home-advantage-model.md', docs);
          NODE
      - name: Commit finalized guaranteed Champions profiles
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/generate-final-champions-home-profiles.yml
          git add tests/home-advantage-model.test.js docs/home-advantage-model.md
          git commit -m "Finalize guaranteed Champions home profiles"
          git push origin HEAD:agent/complete-guaranteed-champions-home-profiles

name: Finalize guaranteed Europa profiles

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  finalize:
    if: github.head_ref == 'agent/complete-guaranteed-europa-home-profiles'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/complete-guaranteed-europa-home-profiles
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Lock final Europa regression values and documentation
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          function replaceChecked(text, before, after, label) {
            if (!text.includes(before)) throw new Error(`Missing replacement target: ${label}`);
            return text.replace(before, after);
          }

          let test = fs.readFileSync('tests/home-advantage-model.test.js', 'utf8');
          test = replaceChecked(test,
            "assert.equal(records.length, 865, 'Stored source archive must contain 865 home matches.');",
            "assert.equal(records.length, 906, 'Stored source archive must contain 906 home matches.');",
            'archive count');
          test = replaceChecked(test,
            "assert.equal(records.filter((match) => match.competitionType === 'domestic').length, 850);",
            "assert.equal(records.filter((match) => match.competitionType === 'domestic').length, 891);",
            'domestic archive count');
          test = replaceChecked(test,
            "assert.equal(records.filter((match) => match.homeSlug === 'slavia').length, 18);",
            "assert.equal(records.filter((match) => match.homeSlug === 'slavia').length, 18);\nassert.equal(records.filter((match) => match.homeSlug === 'sunderland').length, 24);\nassert.equal(records.filter((match) => match.homeSlug === 'sunderland' && match.date === '2025-05-13').length, 1);\nassert.equal(records.filter((match) => match.sourceKey === 'liga-portugal-official-2024-25').length, 4);",
            'special final-team counts');
          test = replaceChecked(test,
            "  'leipzig', 'lens', 'lille', 'marseille', 'porto', 'psg', 'psv', 'rennais',\n  'sporting', 'stuttgart'",
            "  'leipzig', 'lens', 'lille', 'marseille', 'porto', 'psg', 'psv', 'rennais',\n  'sporting', 'stuttgart', 'torreense'",
            '17-match team list');
          test = replaceChecked(test,
            "assert.equal(generated.sourceSummary.storedMatches, 865);\nassert.equal(generated.sourceSummary.matches, 753);\nassert.equal(generated.sourceSummary.excludedStoredMatches, 112);\nassert.equal(generated.sourceSummary.teams, 40);",
            "assert.equal(generated.sourceSummary.storedMatches, 906);\nassert.equal(generated.sourceSummary.matches, 794);\nassert.equal(generated.sourceSummary.excludedStoredMatches, 112);\nassert.equal(generated.sourceSummary.teams, 42);",
            'generated summary counts');
          test = replaceChecked(test,
            "assert.equal(generated.sourceSummary.domesticMatches, 741);",
            "assert.equal(generated.sourceSummary.domesticMatches, 782);",
            'active domestic count');
          test = replaceChecked(test,
            "  stuttgart: 1.18,\n  villareal: 1.18",
            "  stuttgart: 1.18,\n  sunderland: 0.9235,\n  torreense: 1.0528,\n  villareal: 1.18",
            'final domestic attacks');
          test = replaceChecked(test,
            "assert.equal(generated.profiles.stuttgart.attack.vsWeaker, 0.9697);\nassert.equal(generated.profiles.villareal.attack.overall, 1.1617);",
            "assert.equal(generated.profiles.stuttgart.attack.vsWeaker, 0.9697);\nassert.equal(generated.profiles.sunderland.attack.overall, 0.935);\nassert.equal(generated.profiles.sunderland.attack.vsSimilar, 0.9235);\nassert.equal(generated.profiles.sunderland.defense.overall, 0.8822);\nassert.equal(generated.profiles.sunderland.defense.domestic, 0.8614);\nassert.equal(generated.profiles.sunderland.samples.overall.raw, 24);\nassert.equal(generated.profiles.torreense.attack.overall, 1.0434);\nassert.equal(generated.profiles.torreense.attack.vsStronger, 1.0899);\nassert.equal(generated.profiles.torreense.attack.vsSimilar, 1.0241);\nassert.equal(generated.profiles.torreense.defense.domestic, 1.1549);\nassert.equal(generated.profiles.torreense.defense.vsSimilar, 1.1024);\nassert.equal(generated.profiles.villareal.attack.overall, 1.1617);",
            'final profile contexts');
          test = replaceChecked(test,
            "assert.equal(generated.researchQueue.length, 2);\nassert.equal(generated.researchQueue[0], 'sunderland');\nassert.equal(generated.researchQueue.at(-1), 'torreense');",
            "assert.equal(generated.researchQueue.length, 0);\nassert.deepEqual(Array.from(generated.researchQueue), []);",
            'empty research queue');
          fs.writeFileSync('tests/home-advantage-model.test.js', test);

          let docs = fs.readFileSync('docs/home-advantage-model.md', 'utf8');
          docs = replaceChecked(docs,
            'The archive contains 865 verified home matches. The guaranteed-team filter currently includes 753 matches across 40 active profiles:',
            'The archive contains 906 verified home matches. The guaranteed-team filter currently includes 794 matches across all 42 active profiles:',
            'documentation counts');
          docs = replaceChecked(docs,
            '- AZ Alkmaar, Bayer Leverkusen, Bayern München, Borussia Dortmund, Feyenoord, Hoffenheim, Lens, Lille, Marseille, Paris Saint-Germain, Porto, PSV, RB Leipzig, Rennes, Sporting CP, and VfB Stuttgart: 17 each;',
            '- AZ Alkmaar, Bayer Leverkusen, Bayern München, Borussia Dortmund, Feyenoord, Hoffenheim, Lens, Lille, Marseille, Paris Saint-Germain, Porto, PSV, RB Leipzig, Rennes, Sporting CP, Torreense, and VfB Stuttgart: 17 each;',
            'documentation 17-match list');
          docs = replaceChecked(docs,
            '- Slavia Prague: 18, including the championship round.',
            '- Slavia Prague: 18, including the championship round;\n- Sunderland: 24, including its home Championship play-off semifinal.',
            'documentation Sunderland count');
          docs = replaceChecked(docs,
            'The remaining 112 archived records are retained but excluded from runtime generation. All 29 guaranteed Champions League clubs have active profiles. AZ Alkmaar, Bayer Leverkusen, Bournemouth, Celta Vigo, Crystal Palace, Hoffenheim, Juventus, Marseille, Milan, Real Sociedad, and Rennes are completed guaranteed Europa League clubs, and the research queue now begins with Sunderland.',
            'The remaining 112 archived records are retained but excluded from runtime generation. All 29 guaranteed Champions League clubs and all 13 guaranteed Europa League clubs now have active profiles. The guaranteed-team research queue is empty.',
            'documentation completed scope');
          docs = replaceChecked(docs,
            "Bournemouth scores below its coefficient baseline but shows a strong positive home defensive effect. Its attack values are `0.9967` against stronger opponents and `0.9308` against similar opponents. Crystal Palace is approximately neutral overall, rises to `1.1448` against stronger opponents, and falls to `0.9192` against similar opponents. Neither club has weaker-opponent observations under the current coefficient snapshot.\n\n### Spain and Germany 2024/25",
            "Bournemouth scores below its coefficient baseline but shows a strong positive home defensive effect. Its attack values are `0.9967` against stronger opponents and `0.9308` against similar opponents. Crystal Palace is approximately neutral overall, rises to `1.1448` against stronger opponents, and falls to `0.9192` against similar opponents. Neither club has weaker-opponent observations under the current coefficient snapshot.\n\n`sunderland-torreense-2024-25.json` adds Sunderland's 23 regular Championship home matches plus its home play-off semifinal. The neutral Wembley final is not treated as a home fixture.\n\n| Club | Domestic attack | Domestic visiting-goal multiplier |\n|---|---:|---:|\n| Sunderland | 0.9235 | 0.8614 |\n\nSunderland scores below its coefficient baseline but shows a strong positive home defensive residual. All 24 observations fall into the similar-opponent bucket under the current coefficient snapshot.\n\n### Spain and Germany 2024/25",
            'Sunderland documentation');
          docs = replaceChecked(docs,
            "Porto remains below the attack ceiling and is approximately neutral against similar-strength opponents at `0.9779`. Its weaker-opponent visiting-goal multiplier is `0.8311`, a strong positive home defensive signal in that context. Sporting is also below the ceiling; its similar-opponent attack residual is `0.9754`, while the corresponding visiting-goal multiplier is `0.8817`.\n\n### Ukraine and Czechia 2024/25",
            "Porto remains below the attack ceiling and is approximately neutral against similar-strength opponents at `0.9779`. Its weaker-opponent visiting-goal multiplier is `0.8311`, a strong positive home defensive signal in that context. Sporting is also below the ceiling; its similar-opponent attack residual is `0.9754`, while the corresponding visiting-goal multiplier is `0.8817`.\n\nThe final batch also contains all 17 Torreense Segunda Liga home matches. The pinned OpenFootball file provides scores through matchday 26; four later home results are completed from official Liga Portugal match records and carry a separate source key.\n\n| Club | Domestic attack | Notable context |\n|---|---:|---:|\n| Torreense | 1.0528 | Similar opponents: 1.0241 |\n\nTorreense scores modestly above its coefficient baseline. Its domestic visiting-goal multiplier is `1.1549`, so this sample does not show a positive home defensive residual. No weaker-opponent observation exists under the current coefficient snapshot.\n\n### Ukraine and Czechia 2024/25",
            'Torreense documentation');
          fs.writeFileSync('docs/home-advantage-model.md', docs);
          NODE
      - name: Commit completed guaranteed-team coverage
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/generate-final-europa-home-profiles.yml
          git add tests/home-advantage-model.test.js docs/home-advantage-model.md
          git commit -m "Complete guaranteed-team home profile coverage"
          git push origin HEAD:agent/complete-guaranteed-europa-home-profiles

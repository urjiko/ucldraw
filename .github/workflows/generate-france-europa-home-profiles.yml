name: Finalize French Europa home profiles

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  finalize:
    if: github.head_ref == 'agent/add-marseille-rennes-europa-profiles'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/add-marseille-rennes-europa-profiles
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Lock French Europa regression values and documentation
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          function replaceChecked(text, before, after, label) {
            if (!text.includes(before)) throw new Error(`Missing replacement target: ${label}`);
            return text.replace(before, after);
          }

          let test = fs.readFileSync('tests/home-advantage-model.test.js', 'utf8');
          test = replaceChecked(test,
            "assert.equal(records.length, 831, 'Stored source archive must contain 831 home matches.');",
            "assert.equal(records.length, 865, 'Stored source archive must contain 865 home matches.');",
            'archive count');
          test = replaceChecked(test,
            "assert.equal(records.filter((match) => match.competitionType === 'domestic').length, 816);",
            "assert.equal(records.filter((match) => match.competitionType === 'domestic').length, 850);",
            'domestic archive count');
          test = replaceChecked(test,
            "  'azalkmaar', 'bayerleverkusen', 'bayern', 'bvb', 'feyenoord', 'hoffenheim',\n  'leipzig', 'lens', 'lille', 'porto', 'psg', 'psv', 'sporting', 'stuttgart'",
            "  'azalkmaar', 'bayerleverkusen', 'bayern', 'bvb', 'feyenoord', 'hoffenheim',\n  'leipzig', 'lens', 'lille', 'marseille', 'porto', 'psg', 'psv', 'rennais',\n  'sporting', 'stuttgart'",
            '17-match team list');
          test = replaceChecked(test,
            "assert.equal(generated.sourceSummary.storedMatches, 831);\nassert.equal(generated.sourceSummary.matches, 719);\nassert.equal(generated.sourceSummary.excludedStoredMatches, 112);\nassert.equal(generated.sourceSummary.teams, 38);",
            "assert.equal(generated.sourceSummary.storedMatches, 865);\nassert.equal(generated.sourceSummary.matches, 753);\nassert.equal(generated.sourceSummary.excludedStoredMatches, 112);\nassert.equal(generated.sourceSummary.teams, 40);",
            'generated summary counts');
          test = replaceChecked(test,
            "assert.equal(generated.sourceSummary.domesticMatches, 707);",
            "assert.equal(generated.sourceSummary.domesticMatches, 741);",
            'active domestic count');
          test = replaceChecked(test,
            "  manu: 0.84,\n  milan: 0.9424,",
            "  manu: 0.84,\n  marseille: 1.18,\n  milan: 0.9424,",
            'Marseille domestic attack');
          test = replaceChecked(test,
            "  realsociedad: 0.84,\n  roma: 1.017,",
            "  realsociedad: 0.84,\n  rennais: 0.9583,\n  roma: 1.017,",
            'Rennes domestic attack');
          test = replaceChecked(test,
            "assert.equal(generated.profiles.manu.attack.vsSimilar, 0.8892);\nassert.equal(generated.profiles.milan.attack.overall, 0.9522);",
            "assert.equal(generated.profiles.manu.attack.vsSimilar, 0.8892);\nassert.equal(generated.profiles.marseille.attack.overall, 1.18);\nassert.equal(generated.profiles.marseille.attack.vsStronger, 0.9323);\nassert.equal(generated.profiles.marseille.attack.vsSimilar, 1.17);\nassert.equal(generated.profiles.marseille.attack.vsWeaker, 1.18);\nassert.equal(generated.profiles.marseille.defense.vsSimilar, 1.1145);\nassert.equal(generated.profiles.milan.attack.overall, 0.9522);",
            'Marseille context assertions');
          test = replaceChecked(test,
            "assert.equal(generated.profiles.realsociedad.defense.vsSimilar, 0.8691);\nassert.equal(generated.profiles.roma.attack.vsWeaker, 1.0533);",
            "assert.equal(generated.profiles.realsociedad.defense.vsSimilar, 0.8691);\nassert.equal(generated.profiles.rennais.attack.overall, 0.9658);\nassert.equal(generated.profiles.rennais.attack.vsStronger, 1.0003);\nassert.equal(generated.profiles.rennais.attack.vsSimilar, 0.9823);\nassert.equal(generated.profiles.rennais.attack.vsWeaker, 0.9618);\nassert.equal(generated.profiles.rennais.defense.domestic, 1.0401);\nassert.equal(generated.profiles.rennais.defense.vsWeaker, 0.861);\nassert.equal(generated.profiles.roma.attack.vsWeaker, 1.0533);",
            'Rennes context assertions');
          test = replaceChecked(test,
            "assert.equal(generated.researchQueue.length, 4);\nassert.equal(generated.researchQueue[0], 'marseille');",
            "assert.equal(generated.researchQueue.length, 2);\nassert.equal(generated.researchQueue[0], 'sunderland');",
            'research queue');
          fs.writeFileSync('tests/home-advantage-model.test.js', test);

          let docs = fs.readFileSync('docs/home-advantage-model.md', 'utf8');
          docs = replaceChecked(docs,
            'The archive contains 831 verified home matches. The guaranteed-team filter currently includes 719 matches across 38 active profiles:',
            'The archive contains 865 verified home matches. The guaranteed-team filter currently includes 753 matches across 40 active profiles:',
            'documentation counts');
          docs = replaceChecked(docs,
            '- AZ Alkmaar, Bayer Leverkusen, Bayern München, Borussia Dortmund, Feyenoord, Hoffenheim, Lens, Lille, Paris Saint-Germain, Porto, PSV, RB Leipzig, Sporting CP, and VfB Stuttgart: 17 each;',
            '- AZ Alkmaar, Bayer Leverkusen, Bayern München, Borussia Dortmund, Feyenoord, Hoffenheim, Lens, Lille, Marseille, Paris Saint-Germain, Porto, PSV, RB Leipzig, Rennes, Sporting CP, and VfB Stuttgart: 17 each;',
            'documentation 17-match list');
          docs = replaceChecked(docs,
            'The remaining 112 archived records are retained but excluded from runtime generation. All 29 guaranteed Champions League clubs have active profiles. AZ Alkmaar, Bayer Leverkusen, Bournemouth, Celta Vigo, Crystal Palace, Hoffenheim, Juventus, Milan, and Real Sociedad are completed guaranteed Europa League clubs, and the research queue now begins with Marseille.',
            'The remaining 112 archived records are retained but excluded from runtime generation. All 29 guaranteed Champions League clubs have active profiles. AZ Alkmaar, Bayer Leverkusen, Bournemouth, Celta Vigo, Crystal Palace, Hoffenheim, Juventus, Marseille, Milan, Real Sociedad, and Rennes are completed guaranteed Europa League clubs, and the research queue now begins with Sunderland.',
            'documentation queue');
          docs = replaceChecked(docs,
            "Lens scored below the coefficient baseline overall but above it against stronger opponents. Its stronger-opponent visiting-goal multiplier is `0.9804`, a small positive home defensive effect in that context. Lille is approximately neutral overall, while Paris Saint-Germain shows a strong domestic attacking residual. All PSG league opponents fall into the weaker-opponent bucket under the current coefficient snapshot, so no unsupported similar- or stronger-opponent effect is emitted.\n\n### Portugal 2024/25",
            "Lens scored below the coefficient baseline overall but above it against stronger opponents. Its stronger-opponent visiting-goal multiplier is `0.9804`, a small positive home defensive effect in that context. Lille is approximately neutral overall, while Paris Saint-Germain shows a strong domestic attacking residual. All PSG league opponents fall into the weaker-opponent bucket under the current coefficient snapshot, so no unsupported similar- or stronger-opponent effect is emitted.\n\n`marseille-rennes-2024-25.json` adds all 34 Ligue 1 home matches for two guaranteed Europa League clubs, 17 per club.\n\n| Club | Domestic attack | Notable context |\n|---|---:|---:|\n| Marseille | 1.1800 | Similar opponents: 1.1700 |\n| Rennes | 0.9583 | Weaker-opponent visiting-goal multiplier: 0.8610 |\n\nMarseille reaches the conservative attack ceiling overall and against weaker opponents, while its single stronger-opponent observation is below neutral at `0.9323`. Rennes remains slightly below its coefficient baseline in attack, but the `0.8610` visiting-goal multiplier against weaker opponents indicates a strong positive home defensive effect in that context.\n\n### Portugal 2024/25",
            'French Europa documentation');
          fs.writeFileSync('docs/home-advantage-model.md', docs);
          NODE
      - name: Commit finalized French Europa profiles
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/generate-france-europa-home-profiles.yml
          git add tests/home-advantage-model.test.js docs/home-advantage-model.md
          git commit -m "Finalize Marseille and Rennes Europa profiles"
          git push origin HEAD:agent/add-marseille-rennes-europa-profiles

name: Generate France home profiles

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    if: github.head_ref == 'agent/add-lens-lille-psg-home-profiles' && !contains(github.event.pull_request.head.sha, '[france profile snapshot]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/add-lens-lille-psg-home-profiles
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build normalized French home matches
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const vm = require('node:vm');

          (async () => {
            const response = await fetch('https://raw.githubusercontent.com/openfootball/europe/master/france/2024-25_fr1.txt');
            if (!response.ok) throw new Error(`OpenFootball request failed: ${response.status}`);
            const source = await response.text();

            const coefficientContext = { window: {}, Object };
            vm.runInNewContext(fs.readFileSync('generated-club-coefficients.js', 'utf8'), coefficientContext);
            const coefficients = coefficientContext.window.UCLDRAW_CLUB_COEFFICIENTS.clubs;
            const associationFloor = 16.699;

            const teams = {
              'AJ Auxerre': { slug: 'auxerre', name: 'Auxerre', aliases: ['auxerre'] },
              'Angers SCO': { slug: 'angers', name: 'Angers', aliases: ['angers'] },
              'AS Monaco FC': { slug: 'monaco', name: 'Monaco', aliases: ['monaco'] },
              'AS Saint-Étienne': { slug: 'saintetienne', name: 'Saint-Étienne', aliases: ['saintetienne'] },
              'FC Nantes': { slug: 'nantes', name: 'Nantes', aliases: ['nantes'] },
              'Le Havre AC': { slug: 'lehavre', name: 'Le Havre', aliases: ['lehavre'] },
              'Lille OSC': { slug: 'lille', name: 'Lille', aliases: ['lille'] },
              'Montpellier HSC': { slug: 'montpellier', name: 'Montpellier', aliases: ['montpellier'] },
              'OGC Nice': { slug: 'nice', name: 'Nice', aliases: ['nice'] },
              'Olympique Lyonnais': { slug: 'lyon', name: 'Lyon', aliases: ['lyon'] },
              'Olympique de Marseille': { slug: 'marseille', name: 'Marseille', aliases: ['marseille'] },
              'Paris Saint-Germain FC': { slug: 'psg', name: 'Paris Saint-Germain', aliases: ['psg'] },
              'RC Strasbourg Alsace': { slug: 'strasbourg', name: 'Strasbourg', aliases: ['strasbourg'] },
              'Racing Club de Lens': { slug: 'lens', name: 'Lens', aliases: ['lens'] },
              'Stade Brestois 29': { slug: 'brest', name: 'Brest', aliases: ['brest'] },
              'Stade Rennais FC 1901': { slug: 'rennes', name: 'Rennes', aliases: ['rennes'] },
              'Stade de Reims': { slug: 'reims', name: 'Reims', aliases: ['reims'] },
              'Toulouse FC': { slug: 'toulouse', name: 'Toulouse', aliases: ['toulouse'] }
            };
            const targets = new Set(['lens', 'lille', 'psg']);
            const monthIndex = { Jan: 0, Feb: 1, Mar: 2, Apr: 3, May: 4, Jun: 5, Jul: 6, Aug: 7, Sep: 8, Oct: 9, Nov: 10, Dec: 11 };

            function coefficientFor(team) {
              for (const alias of team.aliases) {
                const value = Number(coefficients[alias]?.coefficient);
                if (Number.isFinite(value)) return value;
              }
              return associationFloor;
            }

            let currentYear = 2024;
            let previousMonth = null;
            let currentDate = null;
            const records = [];

            for (const line of source.split(/\r?\n/)) {
              const dateMatch = line.match(/^\s*(?:Mon|Tue|Wed|Thu|Fri|Sat|Sun)\s+([A-Z][a-z]{2})\s+(\d{1,2})(?:\s+(\d{4}))?\s*$/);
              if (dateMatch) {
                const month = monthIndex[dateMatch[1]];
                if (dateMatch[3]) currentYear = Number(dateMatch[3]);
                else if (previousMonth !== null && month < previousMonth - 6) currentYear += 1;
                previousMonth = month;
                currentDate = `${currentYear}-${String(month + 1).padStart(2, '0')}-${String(Number(dateMatch[2])).padStart(2, '0')}`;
                continue;
              }

              const match = line.match(/^\s*(?:\d{2}:\d{2}\s+)?(.+?)\s+v\s+(.+?)\s+(\d+)-(\d+)(?:\s+\([^)]*\))?(?:\s+\[[^\]]+\])?\s*$/);
              if (!match || !currentDate) continue;
              const home = teams[match[1].trim()];
              const away = teams[match[2].trim()];
              if (!home || !away || !targets.has(home.slug)) continue;

              records.push({
                date: currentDate,
                competitionType: 'domestic',
                competition: 'French Ligue 1 2024/25',
                homeSlug: home.slug,
                homeName: home.name,
                homeCountry: 'FRA',
                awaySlug: away.slug,
                awayName: away.name,
                awayCountry: 'FRA',
                homeCoefficient: coefficientFor(home),
                awayCoefficient: coefficientFor(away),
                homePot: 1,
                awayPot: 1,
                potCount: 1,
                homeGoals: Number(match[3]),
                awayGoals: Number(match[4]),
                sourceKey: 'openfootball-france-2024-25'
              });
            }

            records.sort((left, right) => left.date.localeCompare(right.date) || left.homeSlug.localeCompare(right.homeSlug));
            if (records.length !== 51) throw new Error(`Expected 51 French home matches, received ${records.length}.`);
            for (const slug of targets) {
              const count = records.filter((record) => record.homeSlug === slug).length;
              if (count !== 17) throw new Error(`Expected 17 ${slug} home matches, received ${count}.`);
            }

            fs.writeFileSync('data/home-advantage-matches/lens-lille-psg-2024-25.json', `${JSON.stringify(records)}\n`);
            console.log(JSON.stringify(Object.fromEntries([...targets].map((slug) => [slug, records.filter((record) => record.homeSlug === slug).length]))));
          })().catch((error) => {
            console.error(error);
            process.exitCode = 1;
          });
          NODE
      - name: Regenerate profile payload
        run: node scripts/build-home-advantage-profiles.mjs
      - name: Commit verified French profiles
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/home-advantage-matches/lens-lille-psg-2024-25.json generated-home-advantage-profiles.js
          if ! git diff --cached --quiet; then
            git commit -m "Generate French guaranteed profiles [france profile snapshot]"
            git push origin HEAD:agent/add-lens-lille-psg-home-profiles
          fi

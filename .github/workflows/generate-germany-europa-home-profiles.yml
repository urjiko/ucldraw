name: Generate German Europa home profiles

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    if: github.head_ref == 'agent/add-leverkusen-hoffenheim-europa-profiles'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/add-leverkusen-hoffenheim-europa-profiles
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build Leverkusen and Hoffenheim home matches
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const vm = require('node:vm');

          (async () => {
            const response = await fetch('https://raw.githubusercontent.com/openfootball/europe/master/germany/2024-25_de1.txt');
            if (!response.ok) throw new Error(`OpenFootball request failed: ${response.status}`);
            const source = await response.text();

            const coefficientContext = { window: {}, Object };
            vm.runInNewContext(fs.readFileSync('generated-club-coefficients.js', 'utf8'), coefficientContext);
            const coefficients = coefficientContext.window.UCLDRAW_CLUB_COEFFICIENTS.clubs;
            const associationFloor = 18.58;
            const teams = {
              'Borussia Mönchengladbach': { slug: 'gladbach', name: 'Borussia Mönchengladbach', aliases: ['gladbach'] },
              'Bayer 04 Leverkusen': { slug: 'bayerleverkusen', name: 'Bayer Leverkusen', aliases: ['bayerleverkusen'] },
              'RB Leipzig': { slug: 'leipzig', name: 'RB Leipzig', aliases: ['leipzig'] },
              'VfL Bochum 1848': { slug: 'bochum', name: 'Bochum', aliases: ['bochum'] },
              'TSG 1899 Hoffenheim': { slug: 'hoffenheim', name: 'Hoffenheim', aliases: ['hoffenheim'] },
              'Holstein Kiel': { slug: 'holsteinkiel', name: 'Holstein Kiel', aliases: ['holsteinkiel'] },
              'SC Freiburg': { slug: 'freiburg', name: 'SC Freiburg', aliases: ['freiburg'] },
              'VfB Stuttgart': { slug: 'stuttgart', name: 'VfB Stuttgart', aliases: ['stuttgart'] },
              'FC Augsburg': { slug: 'augsburg', name: 'FC Augsburg', aliases: ['augsburg'] },
              'SV Werder Bremen': { slug: 'werder', name: 'Werder Bremen', aliases: ['werder'] },
              '1. FSV Mainz 05': { slug: 'mainz', name: 'Mainz 05', aliases: ['mainz'] },
              '1. FC Union Berlin': { slug: 'union', name: 'Union Berlin', aliases: ['union'] },
              'Borussia Dortmund': { slug: 'bvb', name: 'Borussia Dortmund', aliases: ['bvb'] },
              'Eintracht Frankfurt': { slug: 'frankfurt', name: 'Eintracht Frankfurt', aliases: ['frankfurt'] },
              'VfL Wolfsburg': { slug: 'wolfsburg', name: 'Wolfsburg', aliases: ['wolfsburg'] },
              'FC Bayern München': { slug: 'bayern', name: 'Bayern München', aliases: ['bayern'] },
              'FC St. Pauli 1910': { slug: 'stpauli', name: 'St. Pauli', aliases: ['stpauli'] },
              '1. FC Heidenheim 1846': { slug: 'heidenheim', name: 'Heidenheim', aliases: ['heidenheim'] }
            };
            const targets = new Set(['bayerleverkusen', 'hoffenheim']);
            const monthIndex = { Jan: 0, Feb: 1, Mar: 2, Apr: 3, May: 4, Jun: 5, Jul: 6, Aug: 7, Sep: 8, Oct: 9, Nov: 10, Dec: 11 };

            function coefficientFor(team) {
              for (const alias of team.aliases) {
                const value = Number(coefficients[alias]?.coefficient);
                if (Number.isFinite(value)) return value;
              }
              return associationFloor;
            }

            let currentYear = 2024;
            let previousMonth = null;
            let currentDate = null;
            const records = [];
            for (const line of source.split(/\r?\n/)) {
              const dateMatch = line.match(/^\s*(?:Mon|Tue|Wed|Thu|Fri|Sat|Sun)\s+([A-Z][a-z]{2})\s+(\d{1,2})(?:\s+(\d{4}))?\s*$/);
              if (dateMatch) {
                const month = monthIndex[dateMatch[1]];
                if (dateMatch[3]) currentYear = Number(dateMatch[3]);
                else if (previousMonth !== null && month < previousMonth - 6) currentYear += 1;
                previousMonth = month;
                currentDate = `${currentYear}-${String(month + 1).padStart(2, '0')}-${String(Number(dateMatch[2])).padStart(2, '0')}`;
                continue;
              }
              const match = line.match(/^\s*(?:\d{2}:\d{2}\s+)?(.+?)\s+v\s+(.+?)\s+(\d+)-(\d+)(?:\s+\([^)]*\))?(?:\s+\[[^\]]+\])?\s*$/);
              if (!match || !currentDate) continue;
              const home = teams[match[1].trim()];
              const away = teams[match[2].trim()];
              if (!home || !away || !targets.has(home.slug)) continue;
              records.push({
                date: currentDate,
                competitionType: 'domestic',
                competition: 'Deutsche Bundesliga 2024/25',
                homeSlug: home.slug,
                homeName: home.name,
                homeCountry: 'GER',
                awaySlug: away.slug,
                awayName: away.name,
                awayCountry: 'GER',
                homeCoefficient: coefficientFor(home),
                awayCoefficient: coefficientFor(away),
                homePot: 1,
                awayPot: 1,
                potCount: 1,
                homeGoals: Number(match[3]),
                awayGoals: Number(match[4]),
                sourceKey: 'openfootball-germany-2024-25'
              });
            }
            records.sort((left, right) => left.date.localeCompare(right.date) || left.homeSlug.localeCompare(right.homeSlug));
            if (records.length !== 34) throw new Error(`Expected 34 German Europa home matches, received ${records.length}.`);
            for (const slug of targets) {
              const count = records.filter((record) => record.homeSlug === slug).length;
              if (count !== 17) throw new Error(`Expected 17 ${slug} home matches, received ${count}.`);
            }
            fs.writeFileSync('data/home-advantage-matches/leverkusen-hoffenheim-2024-25.json', `${JSON.stringify(records)}\n`);
            console.log(JSON.stringify(Object.fromEntries([...targets].map((slug) => [slug, records.filter((record) => record.homeSlug === slug).length]))));
          })().catch((error) => {
            console.error(error);
            process.exitCode = 1;
          });
          NODE
      - name: Regenerate profile payload
        run: node scripts/build-home-advantage-profiles.mjs
      - name: Commit verified German Europa profiles
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/home-advantage-matches/leverkusen-hoffenheim-2024-25.json generated-home-advantage-profiles.js
          if ! git diff --cached --quiet; then
            git commit -m "Generate German Europa home profiles"
            git push origin HEAD:agent/add-leverkusen-hoffenheim-europa-profiles
          fi

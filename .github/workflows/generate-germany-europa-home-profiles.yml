name: Finalize German Europa home profiles

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  finalize:
    if: github.head_ref == 'agent/add-leverkusen-hoffenheim-europa-profiles'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/add-leverkusen-hoffenheim-europa-profiles
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Lock German Europa regression values and documentation
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          function replaceChecked(text, before, after, label) {
            if (!text.includes(before)) throw new Error(`Missing replacement target: ${label}`);
            return text.replace(before, after);
          }

          let test = fs.readFileSync('tests/home-advantage-model.test.js', 'utf8');
          test = replaceChecked(test,
            "assert.equal(records.length, 683, 'Stored source archive must contain 683 home matches.');",
            "assert.equal(records.length, 717, 'Stored source archive must contain 717 home matches.');",
            'archive count');
          test = replaceChecked(test,
            "assert.equal(records.filter((match) => match.competitionType === 'domestic').length, 668);",
            "assert.equal(records.filter((match) => match.competitionType === 'domestic').length, 702);",
            'domestic archive count');
          test = replaceChecked(test,
            "  'azalkmaar', 'bayern', 'bvb', 'feyenoord', 'leipzig', 'lens', 'lille', 'porto',\n  'psg', 'psv', 'sporting', 'stuttgart'",
            "  'azalkmaar', 'bayerleverkusen', 'bayern', 'bvb', 'feyenoord', 'hoffenheim',\n  'leipzig', 'lens', 'lille', 'porto', 'psg', 'psv', 'sporting', 'stuttgart'",
            '17-match team list');
          test = replaceChecked(test,
            "assert.equal(generated.sourceSummary.storedMatches, 683);\nassert.equal(generated.sourceSummary.matches, 571);\nassert.equal(generated.sourceSummary.excludedStoredMatches, 112);\nassert.equal(generated.sourceSummary.teams, 30);",
            "assert.equal(generated.sourceSummary.storedMatches, 717);\nassert.equal(generated.sourceSummary.matches, 605);\nassert.equal(generated.sourceSummary.excludedStoredMatches, 112);\nassert.equal(generated.sourceSummary.teams, 32);",
            'generated summary counts');
          test = replaceChecked(test,
            "assert.equal(generated.sourceSummary.domesticMatches, 559);",
            "assert.equal(generated.sourceSummary.domesticMatches, 593);",
            'active domestic count');
          test = replaceChecked(test,
            "  azalkmaar: 0.9596,\n  barcelona: 1.18,",
            "  azalkmaar: 0.9596,\n  barcelona: 1.18,\n  bayerleverkusen: 1.0482,",
            'Leverkusen attack value');
          test = replaceChecked(test,
            "  galatasaray: 1.18,\n  inter: 1.0253,",
            "  galatasaray: 1.18,\n  hoffenheim: 1.18,\n  inter: 1.0253,",
            'Hoffenheim attack value');
          test = replaceChecked(test,
            "assert.equal(generated.profiles.azalkmaar.attack.vsWeaker, 0.9843);\nassert.equal(generated.profiles.barcelona.attack.vsSimilar, 1.1055);",
            "assert.equal(generated.profiles.azalkmaar.attack.vsWeaker, 0.9843);\nassert.equal(generated.profiles.barcelona.attack.vsSimilar, 1.1055);\nassert.equal(generated.profiles.bayerleverkusen.attack.overall, 1.0396);\nassert.equal(generated.profiles.bayerleverkusen.attack.vsSimilar, 0.9614);\nassert.equal(generated.profiles.bayerleverkusen.attack.vsWeaker, 1.0649);\nassert.equal(generated.profiles.bayerleverkusen.defense.vsSimilar, 1.1277);",
            'Leverkusen context assertions');
          test = replaceChecked(test,
            "assert.equal(generated.profiles.feyenoord.attack.vsSimilar, 1.0202);\nassert.equal(generated.profiles.inter.attack.vsWeaker, 1.0527);",
            "assert.equal(generated.profiles.feyenoord.attack.vsSimilar, 1.0202);\nassert.equal(generated.profiles.hoffenheim.attack.overall, 1.1645);\nassert.equal(generated.profiles.hoffenheim.attack.vsStronger, 1.18);\nassert.equal(generated.profiles.hoffenheim.defense.vsStronger, 1.16);\nassert.equal(generated.profiles.hoffenheim.samples.vsStronger.raw, 17);\nassert.equal(generated.profiles.inter.attack.vsWeaker, 1.0527);",
            'Hoffenheim context assertions');
          test = replaceChecked(test,
            "assert.equal(generated.researchQueue.length, 12);\nassert.equal(generated.researchQueue[0], 'bayerleverkusen');",
            "assert.equal(generated.researchQueue.length, 10);\nassert.equal(generated.researchQueue[0], 'bournemouth');",
            'Europa queue');
          fs.writeFileSync('tests/home-advantage-model.test.js', test);

          let docs = fs.readFileSync('docs/home-advantage-model.md', 'utf8');
          docs = replaceChecked(docs,
            'The archive contains 683 verified home matches. The guaranteed-team filter currently includes 571 matches across 30 active profiles:',
            'The archive contains 717 verified home matches. The guaranteed-team filter currently includes 605 matches across 32 active profiles:',
            'documentation counts');
          docs = replaceChecked(docs,
            '- AZ Alkmaar, Bayern München, Borussia Dortmund, Feyenoord, Lens, Lille, Paris Saint-Germain, Porto, PSV, RB Leipzig, Sporting CP, and VfB Stuttgart: 17 each;',
            '- AZ Alkmaar, Bayer Leverkusen, Bayern München, Borussia Dortmund, Feyenoord, Hoffenheim, Lens, Lille, Paris Saint-Germain, Porto, PSV, RB Leipzig, Sporting CP, and VfB Stuttgart: 17 each;',
            'documentation German Europa counts');
          docs = replaceChecked(docs,
            'AZ Alkmaar is the first completed guaranteed Europa League club, and the research queue now begins with Bayer Leverkusen.',
            'AZ Alkmaar, Bayer Leverkusen, and Hoffenheim are completed guaranteed Europa League clubs, and the research queue now begins with Bournemouth.',
            'documentation queue');
          docs = replaceChecked(docs,
            "Leipzig remains below the general attack ceiling but shows a strong residual against stronger opponents. Its similar-opponent visiting-goal multiplier is `0.9400`, a positive home defensive signal for that context. Stuttgart reaches the domestic attack ceiling, while its similar-opponent residual is essentially neutral and its single weaker-opponent observation is not treated as a broad conclusion.\n\nThe follow-up Spanish batch",
            "Leipzig remains below the general attack ceiling but shows a strong residual against stronger opponents. Its similar-opponent visiting-goal multiplier is `0.9400`, a positive home defensive signal for that context. Stuttgart reaches the domestic attack ceiling, while its similar-opponent residual is essentially neutral and its single weaker-opponent observation is not treated as a broad conclusion.\n\n`leverkusen-hoffenheim-2024-25.json` adds 34 Bundesliga home matches for the guaranteed Europa League scope, 17 per club.\n\n| Club | Domestic attack | Notable context |\n|---|---:|---:|\n| Bayer Leverkusen | 1.0482 | Weaker opponents: 1.0649 |\n| Hoffenheim | 1.1800 | Stronger opponents: 1.1800 |\n\nLeverkusen remains close to neutral against similar opponents at `0.9614`, while its similar-opponent visiting-goal multiplier is `1.1277`. Hoffenheim reaches the attack ceiling. Under the current coefficient snapshot, all 17 Hoffenheim league opponents fall into the stronger-opponent bucket, so no unsupported similar- or weaker-opponent effect is emitted.\n\nThe follow-up Spanish batch",
            'German Europa documentation');
          fs.writeFileSync('docs/home-advantage-model.md', docs);
          NODE
      - name: Commit finalized German Europa profiles
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/generate-germany-europa-home-profiles.yml
          git add tests/home-advantage-model.test.js docs/home-advantage-model.md
          git commit -m "Finalize German Europa home profiles"
          git push origin HEAD:agent/add-leverkusen-hoffenheim-europa-profiles

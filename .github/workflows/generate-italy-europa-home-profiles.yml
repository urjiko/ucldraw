name: Finalize Italian Europa home profiles

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  finalize:
    if: github.head_ref == 'agent/add-juventus-milan-europa-profiles'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/add-juventus-milan-europa-profiles
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Lock Italian Europa regression values and documentation
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          function replaceChecked(text, before, after, label) {
            if (!text.includes(before)) throw new Error(`Missing replacement target: ${label}`);
            return text.replace(before, after);
          }

          let test = fs.readFileSync('tests/home-advantage-model.test.js', 'utf8');
          test = replaceChecked(test,
            "assert.equal(records.length, 793, 'Stored source archive must contain 793 home matches.');",
            "assert.equal(records.length, 831, 'Stored source archive must contain 831 home matches.');",
            'archive count');
          test = replaceChecked(test,
            "assert.equal(records.filter((match) => match.competitionType === 'domestic').length, 778);",
            "assert.equal(records.filter((match) => match.competitionType === 'domestic').length, 816);",
            'domestic archive count');
          test = replaceChecked(test,
            "  'city', 'como', 'crystalpalace', 'inter', 'liverpool', 'manu', 'napoli',\n  'real', 'realbetis', 'realsociedad', 'roma', 'villareal'",
            "  'city', 'como', 'crystalpalace', 'inter', 'juventus', 'liverpool', 'manu',\n  'milan', 'napoli', 'real', 'realbetis', 'realsociedad', 'roma', 'villareal'",
            '19-match team list');
          test = replaceChecked(test,
            "assert.equal(generated.sourceSummary.storedMatches, 793);\nassert.equal(generated.sourceSummary.matches, 681);\nassert.equal(generated.sourceSummary.excludedStoredMatches, 112);\nassert.equal(generated.sourceSummary.teams, 36);",
            "assert.equal(generated.sourceSummary.storedMatches, 831);\nassert.equal(generated.sourceSummary.matches, 719);\nassert.equal(generated.sourceSummary.excludedStoredMatches, 112);\nassert.equal(generated.sourceSummary.teams, 38);",
            'generated summary counts');
          test = replaceChecked(test,
            "assert.equal(generated.sourceSummary.domesticMatches, 669);",
            "assert.equal(generated.sourceSummary.domesticMatches, 707);",
            'active domestic count');
          test = replaceChecked(test,
            "  inter: 1.0253,\n  leipzig: 1.0758,",
            "  inter: 1.0253,\n  juventus: 0.9539,\n  leipzig: 1.0758,",
            'Juventus domestic attack');
          test = replaceChecked(test,
            "  manu: 0.84,\n  napoli: 0.9873,",
            "  manu: 0.84,\n  milan: 0.9424,\n  napoli: 0.9873,",
            'Milan domestic attack');
          test = replaceChecked(test,
            "assert.equal(generated.profiles.inter.attack.vsWeaker, 1.0527);\nassert.equal(generated.profiles.leipzig.attack.overall, 1.0623);",
            "assert.equal(generated.profiles.inter.attack.vsWeaker, 1.0527);\nassert.equal(generated.profiles.juventus.attack.overall, 0.9618);\nassert.equal(generated.profiles.juventus.attack.vsStronger, 0.9846);\nassert.equal(generated.profiles.juventus.attack.vsSimilar, 0.8521);\nassert.equal(generated.profiles.juventus.attack.vsWeaker, 1.0256);\nassert.equal(generated.profiles.juventus.defense.domestic, 1.0224);\nassert.equal(generated.profiles.juventus.defense.vsStronger, 0.9277);\nassert.equal(generated.profiles.leipzig.attack.overall, 1.0623);",
            'Juventus context assertions');
          test = replaceChecked(test,
            "assert.equal(generated.profiles.manu.attack.vsSimilar, 0.8892);\nassert.equal(generated.profiles.napoli.defense.domestic, 0.9089);",
            "assert.equal(generated.profiles.manu.attack.vsSimilar, 0.8892);\nassert.equal(generated.profiles.milan.attack.overall, 0.9522);\nassert.equal(generated.profiles.milan.attack.vsStronger, 0.9862);\nassert.equal(generated.profiles.milan.attack.vsSimilar, 0.84);\nassert.equal(generated.profiles.milan.attack.vsWeaker, 1.0328);\nassert.equal(generated.profiles.milan.defense.domestic, 1.04);\nassert.equal(generated.profiles.milan.defense.vsSimilar, 0.9831);\nassert.equal(generated.profiles.napoli.defense.domestic, 0.9089);",
            'Milan context assertions');
          test = replaceChecked(test,
            "assert.equal(generated.researchQueue.length, 6);\nassert.equal(generated.researchQueue[0], 'juventus');",
            "assert.equal(generated.researchQueue.length, 4);\nassert.equal(generated.researchQueue[0], 'marseille');",
            'research queue');
          fs.writeFileSync('tests/home-advantage-model.test.js', test);

          let docs = fs.readFileSync('docs/home-advantage-model.md', 'utf8');
          docs = replaceChecked(docs,
            'The archive contains 793 verified home matches. The guaranteed-team filter currently includes 681 matches across 36 active profiles:',
            'The archive contains 831 verified home matches. The guaranteed-team filter currently includes 719 matches across 38 active profiles:',
            'documentation counts');
          docs = replaceChecked(docs,
            '- Arsenal, Aston Villa, Atlético Madrid, Barcelona, Bournemouth, Celta Vigo, Como, Crystal Palace, Internazionale, Liverpool, Manchester City, Manchester United, Napoli, Real Betis, Real Madrid, Real Sociedad, Roma, and Villarreal: 19 each;',
            '- Arsenal, Aston Villa, Atlético Madrid, Barcelona, Bournemouth, Celta Vigo, Como, Crystal Palace, Internazionale, Juventus, Liverpool, Manchester City, Manchester United, Milan, Napoli, Real Betis, Real Madrid, Real Sociedad, Roma, and Villarreal: 19 each;',
            'documentation 19-match list');
          docs = replaceChecked(docs,
            'The remaining 112 archived records are retained but excluded from runtime generation. All 29 guaranteed Champions League clubs have active profiles. AZ Alkmaar, Bayer Leverkusen, Bournemouth, Celta Vigo, Crystal Palace, Hoffenheim, and Real Sociedad are completed guaranteed Europa League clubs, and the research queue now begins with Juventus.',
            'The remaining 112 archived records are retained but excluded from runtime generation. All 29 guaranteed Champions League clubs have active profiles. AZ Alkmaar, Bayer Leverkusen, Bournemouth, Celta Vigo, Crystal Palace, Hoffenheim, Juventus, Milan, and Real Sociedad are completed guaranteed Europa League clubs, and the research queue now begins with Marseille.',
            'documentation queue');
          docs = replaceChecked(docs,
            "Napoli's attack residual is approximately neutral, but its `0.9089` visiting-goal multiplier indicates a positive home defensive effect in this sample.\n\n### Netherlands 2024/25",
            "Napoli's attack residual is approximately neutral, but its `0.9089` visiting-goal multiplier indicates a positive home defensive effect in this sample.\n\n`juventus-milan-2024-25.json` adds all 38 Serie A home matches for two guaranteed Europa League clubs, 19 per club.\n\n| Club | Domestic attack | Notable context |\n|---|---:|---:|\n| Juventus | 0.9539 | Similar opponents: 0.8521 |\n| Milan | 0.9424 | Similar opponents: 0.8400 |\n\nJuventus and Milan both score below their coefficient baselines at home in this season. Juventus rises to `1.0256` against weaker opponents and has a positive home defensive signal against its single stronger-opponent observation at `0.9277`. Milan also rises above neutral against weaker opponents at `1.0328`, while its similar-opponent attack value reaches the conservative `0.84` floor. The values remain residuals after coefficient adjustment, not raw league rankings.\n\n### Netherlands 2024/25",
            'Italian Europa documentation');
          fs.writeFileSync('docs/home-advantage-model.md', docs);
          NODE
      - name: Commit finalized Italian Europa profiles
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/generate-italy-europa-home-profiles.yml
          git add tests/home-advantage-model.test.js docs/home-advantage-model.md
          git commit -m "Finalize Juventus and Milan Europa profiles"
          git push origin HEAD:agent/add-juventus-milan-europa-profiles

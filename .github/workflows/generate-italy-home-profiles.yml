name: Generate Italy home profiles

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build normalized Italian home matches
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const vm = require('node:vm');

          const response = await fetch('https://raw.githubusercontent.com/openfootball/italy/master/2024-25/1-seriea.txt');
          if (!response.ok) throw new Error(`OpenFootball request failed: ${response.status}`);
          const source = await response.text();

          const coefficientContext = { window: {}, Object };
          vm.runInNewContext(fs.readFileSync('generated-club-coefficients.js', 'utf8'), coefficientContext);
          const coefficients = coefficientContext.window.UCLDRAW_CLUB_COEFFICIENTS.clubs;
          const associationFloor = 19.989;

          const teams = {
            'Atalanta BC': { slug: 'atalanta', name: 'Atalanta', aliases: ['atalanta'] },
            'Bologna FC 1909': { slug: 'bologna', name: 'Bologna', aliases: ['bologna'] },
            'Cagliari Calcio': { slug: 'cagliari', name: 'Cagliari', aliases: ['cagliari'] },
            'Como 1907': { slug: 'como', name: 'Como', aliases: ['como'] },
            'Empoli FC': { slug: 'empoli', name: 'Empoli', aliases: ['empoli'] },
            'ACF Fiorentina': { slug: 'fiorentina', name: 'Fiorentina', aliases: ['fiorentina'] },
            'Genoa CFC': { slug: 'genoa', name: 'Genoa', aliases: ['genoa'] },
            'Hellas Verona FC': { slug: 'verona', name: 'Hellas Verona', aliases: ['verona', 'hellasverona'] },
            'FC Internazionale Milano': { slug: 'inter', name: 'Internazionale', aliases: ['inter'] },
            'Juventus FC': { slug: 'juventus', name: 'Juventus', aliases: ['juventus'] },
            'SS Lazio': { slug: 'lazio', name: 'Lazio', aliases: ['lazio'] },
            'US Lecce': { slug: 'lecce', name: 'Lecce', aliases: ['lecce'] },
            'AC Milan': { slug: 'milan', name: 'Milan', aliases: ['milan'] },
            'AC Monza': { slug: 'monza', name: 'Monza', aliases: ['monza'] },
            'SSC Napoli': { slug: 'napoli', name: 'Napoli', aliases: ['napoli'] },
            'Parma Calcio 1913': { slug: 'parma', name: 'Parma', aliases: ['parma'] },
            'AS Roma': { slug: 'roma', name: 'Roma', aliases: ['roma'] },
            'Torino FC': { slug: 'torino', name: 'Torino', aliases: ['torino'] },
            'Udinese Calcio': { slug: 'udinese', name: 'Udinese', aliases: ['udinese'] },
            'Venezia FC': { slug: 'venezia', name: 'Venezia', aliases: ['venezia'] }
          };
          const targets = new Set(['como', 'inter', 'napoli', 'roma']);
          const monthIndex = { Jan: 0, Feb: 1, Mar: 2, Apr: 3, May: 4, Jun: 5, Jul: 6, Aug: 7, Sep: 8, Oct: 9, Nov: 10, Dec: 11 };

          function coefficientFor(team) {
            for (const alias of team.aliases) {
              const value = Number(coefficients[alias]?.coefficient);
              if (Number.isFinite(value)) return value;
            }
            return associationFloor;
          }

          let currentYear = 2024;
          let previousMonth = null;
          let currentDate = null;
          const records = [];

          for (const line of source.split(/\r?\n/)) {
            const dateMatch = line.match(/^\s*(?:Mon|Tue|Wed|Thu|Fri|Sat|Sun)\s+([A-Z][a-z]{2})\s+(\d{1,2})(?:\s+(\d{4}))?\s*$/);
            if (dateMatch) {
              const month = monthIndex[dateMatch[1]];
              if (dateMatch[3]) currentYear = Number(dateMatch[3]);
              else if (previousMonth !== null && month < previousMonth - 6) currentYear += 1;
              previousMonth = month;
              currentDate = `${currentYear}-${String(month + 1).padStart(2, '0')}-${String(Number(dateMatch[2])).padStart(2, '0')}`;
              continue;
            }

            const match = line.match(/^\s*(?:\d{2}:\d{2}\s+)?(.+?)\s+v\s+(.+?)\s+(\d+)-(\d+)(?:\s+\([^)]*\))?\s*$/);
            if (!match || !currentDate) continue;
            const home = teams[match[1].trim()];
            const away = teams[match[2].trim()];
            if (!home || !away || !targets.has(home.slug)) continue;

            records.push({
              date: currentDate,
              competitionType: 'domestic',
              competition: 'Italian Serie A 2024/25',
              homeSlug: home.slug,
              homeName: home.name,
              homeCountry: 'ITA',
              awaySlug: away.slug,
              awayName: away.name,
              awayCountry: 'ITA',
              homeCoefficient: coefficientFor(home),
              awayCoefficient: coefficientFor(away),
              homePot: 1,
              awayPot: 1,
              potCount: 1,
              homeGoals: Number(match[3]),
              awayGoals: Number(match[4]),
              sourceKey: 'openfootball-italy-2024-25'
            });
          }

          records.sort((left, right) => left.date.localeCompare(right.date) || left.homeSlug.localeCompare(right.homeSlug));
          if (records.length !== 76) throw new Error(`Expected 76 Italian home matches, received ${records.length}.`);
          for (const slug of targets) {
            const count = records.filter((record) => record.homeSlug === slug).length;
            if (count !== 19) throw new Error(`Expected 19 ${slug} home matches, received ${count}.`);
          }
          fs.writeFileSync('data/home-advantage-matches/como-inter-napoli-roma-2024-25.json', `${JSON.stringify(records)}\n`);
          console.log(JSON.stringify(Object.fromEntries([...targets].map((slug) => [slug, records.filter((record) => record.homeSlug === slug).length]))));
          NODE
      - name: Regenerate profile payload
        run: node scripts/build-home-advantage-profiles.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: italy-home-profile-snapshot
          path: |
            data/home-advantage-matches/como-inter-napoli-roma-2024-25.json
            generated-home-advantage-profiles.js
          if-no-files-found: error

name: Generate Netherlands home profiles

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build normalized Dutch home matches
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const vm = require('node:vm');

          (async () => {
            const response = await fetch('https://raw.githubusercontent.com/openfootball/europe/master/netherlands/2024-25_nl1.txt');
            if (!response.ok) throw new Error(`OpenFootball request failed: ${response.status}`);
            const source = await response.text();

            const coefficientContext = { window: {}, Object };
            vm.runInNewContext(fs.readFileSync('generated-club-coefficients.js', 'utf8'), coefficientContext);
            const coefficients = coefficientContext.window.UCLDRAW_CLUB_COEFFICIENTS.clubs;
            const associationFloor = Number(coefficients.nec?.coefficient);
            if (!Number.isFinite(associationFloor)) throw new Error('Missing Netherlands association floor.');

            const teams = {
              'Ajax': { slug: 'ajax', name: 'Ajax', aliases: ['ajax'] },
              'Almere City FC': { slug: 'almere', name: 'Almere City', aliases: ['almere'] },
              'AZ': { slug: 'azalkmaar', name: 'AZ Alkmaar', aliases: ['azalkmaar'] },
              'Feyenoord Rotterdam': { slug: 'feyenoord', name: 'Feyenoord', aliases: ['feyenoord'] },
              'Fortuna Sittard': { slug: 'fortuna', name: 'Fortuna Sittard', aliases: ['fortuna'] },
              'Go Ahead Eagles': { slug: 'goaheadeagles', name: 'Go Ahead Eagles', aliases: ['goaheadeagles'] },
              'FC Groningen': { slug: 'groningen', name: 'Groningen', aliases: ['groningen'] },
              'sc Heerenveen': { slug: 'heerenveen', name: 'Heerenveen', aliases: ['heerenveen'] },
              'Heracles Almelo': { slug: 'heracles', name: 'Heracles', aliases: ['heracles'] },
              'NAC Breda': { slug: 'nac', name: 'NAC Breda', aliases: ['nac'] },
              'NEC': { slug: 'nec', name: 'NEC', aliases: ['nec'] },
              'PEC Zwolle': { slug: 'zwolle', name: 'PEC Zwolle', aliases: ['zwolle'] },
              'PSV': { slug: 'psv', name: 'PSV', aliases: ['psv'] },
              'RKC Waalwijk': { slug: 'rkc', name: 'RKC Waalwijk', aliases: ['rkc'] },
              'Sparta Rotterdam': { slug: 'sparta', name: 'Sparta Rotterdam', aliases: ['sparta'] },
              "FC Twente '65": { slug: 'twente', name: 'Twente', aliases: ['twente'] },
              'FC Utrecht': { slug: 'utrecht', name: 'Utrecht', aliases: ['utrecht'] },
              'Willem II Tilburg': { slug: 'willemii', name: 'Willem II', aliases: ['willemii'] }
            };
            const targets = new Set(['feyenoord', 'psv']);
            const monthIndex = { Jan: 0, Feb: 1, Mar: 2, Apr: 3, May: 4, Jun: 5, Jul: 6, Aug: 7, Sep: 8, Oct: 9, Nov: 10, Dec: 11 };

            function coefficientFor(team) {
              for (const alias of team.aliases) {
                const value = Number(coefficients[alias]?.coefficient);
                if (Number.isFinite(value)) return value;
              }
              return associationFloor;
            }

            let currentYear = 2024;
            let previousMonth = null;
            let currentDate = null;
            const records = [];

            for (const line of source.split(/\r?\n/)) {
              const dateMatch = line.match(/^\s*(?:Mon|Tue|Wed|Thu|Fri|Sat|Sun)\s+([A-Z][a-z]{2})\s+(\d{1,2})(?:\s+(\d{4}))?\s*$/);
              if (dateMatch) {
                const month = monthIndex[dateMatch[1]];
                if (dateMatch[3]) currentYear = Number(dateMatch[3]);
                else if (previousMonth !== null && month < previousMonth - 6) currentYear += 1;
                previousMonth = month;
                currentDate = `${currentYear}-${String(month + 1).padStart(2, '0')}-${String(Number(dateMatch[2])).padStart(2, '0')}`;
                continue;
              }

              const match = line.match(/^\s*(?:\d{2}:\d{2}\s+)?(.+?)\s+v\s+(.+?)\s+(\d+)-(\d+)(?:\s+\([^)]*\))?\s*$/);
              if (!match || !currentDate) continue;
              const home = teams[match[1].trim()];
              const away = teams[match[2].trim()];
              if (!home || !away || !targets.has(home.slug)) continue;

              records.push({
                date: currentDate,
                competitionType: 'domestic',
                competition: 'Netherlands Eredivisie 2024/25',
                homeSlug: home.slug,
                homeName: home.name,
                homeCountry: 'NED',
                awaySlug: away.slug,
                awayName: away.name,
                awayCountry: 'NED',
                homeCoefficient: coefficientFor(home),
                awayCoefficient: coefficientFor(away),
                homePot: 1,
                awayPot: 1,
                potCount: 1,
                homeGoals: Number(match[3]),
                awayGoals: Number(match[4]),
                sourceKey: 'openfootball-netherlands-2024-25'
              });
            }

            records.sort((left, right) => left.date.localeCompare(right.date) || left.homeSlug.localeCompare(right.homeSlug));
            if (records.length !== 34) throw new Error(`Expected 34 Dutch home matches, received ${records.length}.`);
            for (const slug of targets) {
              const count = records.filter((record) => record.homeSlug === slug).length;
              if (count !== 17) throw new Error(`Expected 17 ${slug} home matches, received ${count}.`);
            }
            fs.writeFileSync('data/home-advantage-matches/feyenoord-psv-2024-25.json', `${JSON.stringify(records)}\n`);
            console.log(JSON.stringify(Object.fromEntries([...targets].map((slug) => [slug, records.filter((record) => record.homeSlug === slug).length]))));
          })().catch((error) => {
            console.error(error);
            process.exitCode = 1;
          });
          NODE
      - name: Regenerate profile payload
        run: node scripts/build-home-advantage-profiles.mjs
      - name: Commit verified Dutch profiles
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/home-advantage-matches/feyenoord-psv-2024-25.json generated-home-advantage-profiles.js
          if ! git diff --cached --quiet; then
            git commit -m "Generate Dutch guaranteed profiles [netherlands profile snapshot]"
            git push origin HEAD:${{ github.head_ref }}
          fi

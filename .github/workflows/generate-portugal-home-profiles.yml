name: Generate Portugal home profiles

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    if: github.head_ref == 'agent/add-porto-sporting-home-profiles' && !contains(github.event.pull_request.head.sha, '[portugal profile snapshot]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/add-porto-sporting-home-profiles
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build normalized Portuguese home matches
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const vm = require('node:vm');

          (async () => {
            const response = await fetch('https://raw.githubusercontent.com/openfootball/europe/master/portugal/2024-25_pt1.txt');
            if (!response.ok) throw new Error(`OpenFootball request failed: ${response.status}`);
            const source = await response.text();

            const coefficientContext = { window: {}, Object };
            vm.runInNewContext(fs.readFileSync('generated-club-coefficients.js', 'utf8'), coefficientContext);
            const coefficients = coefficientContext.window.UCLDRAW_CLUB_COEFFICIENTS.clubs;
            const associationFloor = 14.633;

            const teams = {
              'AVS': { slug: 'avs', name: 'AVS', aliases: ['avs'] },
              'Boavista FC': { slug: 'boavista', name: 'Boavista', aliases: ['boavista'] },
              'CD Nacional': { slug: 'nacional', name: 'Nacional', aliases: ['nacional'] },
              'CD Santa Clara': { slug: 'santaclara', name: 'Santa Clara', aliases: ['santaclara'] },
              'CF Estrela da Amadora': { slug: 'estreladamadora', name: 'Estrela da Amadora', aliases: ['estreladamadora'] },
              'Casa Pia AC': { slug: 'casapia', name: 'Casa Pia', aliases: ['casapia'] },
              'FC Arouca': { slug: 'arouca', name: 'Arouca', aliases: ['arouca'] },
              'FC Famalicão': { slug: 'famalicao', name: 'Famalicão', aliases: ['famalicao'] },
              'FC Porto': { slug: 'porto', name: 'Porto', aliases: ['porto'] },
              'GD Estoril Praia': { slug: 'estoril', name: 'Estoril', aliases: ['estoril'] },
              'Gil Vicente FC': { slug: 'gilvicente', name: 'Gil Vicente', aliases: ['gilvicente'] },
              'Moreirense FC': { slug: 'moreirense', name: 'Moreirense', aliases: ['moreirense'] },
              'Rio Ave FC': { slug: 'rioave', name: 'Rio Ave', aliases: ['rioave'] },
              'SC Farense': { slug: 'farense', name: 'Farense', aliases: ['farense'] },
              'Sport Lisboa e Benfica': { slug: 'benfica', name: 'Benfica', aliases: ['benfica'] },
              'Sporting Clube de Braga': { slug: 'braga', name: 'Braga', aliases: ['braga'] },
              'Sporting Clube de Portugal': { slug: 'sporting', name: 'Sporting CP', aliases: ['sporting'] },
              'Vitória Guimarães': { slug: 'vitoriaguimaraes', name: 'Vitória Guimarães', aliases: ['vitoriaguimaraes'] }
            };
            const targets = new Set(['porto', 'sporting']);
            const monthIndex = { Jan: 0, Feb: 1, Mar: 2, Apr: 3, May: 4, Jun: 5, Jul: 6, Aug: 7, Sep: 8, Oct: 9, Nov: 10, Dec: 11 };

            function coefficientFor(team) {
              for (const alias of team.aliases) {
                const value = Number(coefficients[alias]?.coefficient);
                if (Number.isFinite(value)) return value;
              }
              return associationFloor;
            }

            let currentYear = 2024;
            let previousMonth = null;
            let currentDate = null;
            const records = [];

            for (const line of source.split(/\r?\n/)) {
              const dateMatch = line.match(/^\s*(?:Mon|Tue|Wed|Thu|Fri|Sat|Sun)\s+([A-Z][a-z]{2})\s+(\d{1,2})(?:\s+(\d{4}))?\s*$/);
              if (dateMatch) {
                const month = monthIndex[dateMatch[1]];
                if (dateMatch[3]) currentYear = Number(dateMatch[3]);
                else if (previousMonth !== null && month < previousMonth - 6) currentYear += 1;
                previousMonth = month;
                currentDate = `${currentYear}-${String(month + 1).padStart(2, '0')}-${String(Number(dateMatch[2])).padStart(2, '0')}`;
                continue;
              }

              const match = line.match(/^\s*(?:\d{2}:\d{2}\s+)?(.+?)\s+v\s+(.+?)\s+(\d+)-(\d+)(?:\s+\([^)]*\))?(?:\s+\[[^\]]+\])?\s*$/);
              if (!match || !currentDate) continue;
              const home = teams[match[1].trim()];
              const away = teams[match[2].trim()];
              if (!home || !away || !targets.has(home.slug)) continue;

              records.push({
                date: currentDate,
                competitionType: 'domestic',
                competition: 'Portuguese Primeira Liga 2024/25',
                homeSlug: home.slug,
                homeName: home.name,
                homeCountry: 'POR',
                awaySlug: away.slug,
                awayName: away.name,
                awayCountry: 'POR',
                homeCoefficient: coefficientFor(home),
                awayCoefficient: coefficientFor(away),
                homePot: 1,
                awayPot: 1,
                potCount: 1,
                homeGoals: Number(match[3]),
                awayGoals: Number(match[4]),
                sourceKey: 'openfootball-portugal-2024-25'
              });
            }

            records.sort((left, right) => left.date.localeCompare(right.date) || left.homeSlug.localeCompare(right.homeSlug));
            if (records.length !== 34) throw new Error(`Expected 34 Portuguese home matches, received ${records.length}.`);
            for (const slug of targets) {
              const count = records.filter((record) => record.homeSlug === slug).length;
              if (count !== 17) throw new Error(`Expected 17 ${slug} home matches, received ${count}.`);
            }

            fs.writeFileSync('data/home-advantage-matches/porto-sporting-2024-25.json', `${JSON.stringify(records)}\n`);
            console.log(JSON.stringify(Object.fromEntries([...targets].map((slug) => [slug, records.filter((record) => record.homeSlug === slug).length]))));
          })().catch((error) => {
            console.error(error);
            process.exitCode = 1;
          });
          NODE
      - name: Regenerate profile payload
        run: node scripts/build-home-advantage-profiles.mjs
      - name: Commit verified Portuguese profiles
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/home-advantage-matches/porto-sporting-2024-25.json generated-home-advantage-profiles.js
          if ! git diff --cached --quiet; then
            git commit -m "Generate Portuguese guaranteed profiles [portugal profile snapshot]"
            git push origin HEAD:agent/add-porto-sporting-home-profiles
          fi

name: Finalize Spanish Europa home profiles

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  finalize:
    if: github.head_ref == 'agent/add-celta-sociedad-europa-profiles'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/add-celta-sociedad-europa-profiles
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Lock Spanish Europa regression values and documentation
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          function replaceChecked(text, before, after, label) {
            if (!text.includes(before)) throw new Error(`Missing replacement target: ${label}`);
            return text.replace(before, after);
          }

          let test = fs.readFileSync('tests/home-advantage-model.test.js', 'utf8');
          test = replaceChecked(test,
            "assert.equal(records.length, 755, 'Stored source archive must contain 755 home matches.');",
            "assert.equal(records.length, 793, 'Stored source archive must contain 793 home matches.');",
            'archive count');
          test = replaceChecked(test,
            "assert.equal(records.filter((match) => match.competitionType === 'domestic').length, 740);",
            "assert.equal(records.filter((match) => match.competitionType === 'domestic').length, 778);",
            'domestic archive count');
          test = replaceChecked(test,
            "  'arsenal', 'astonvilla', 'atleti', 'barcelona', 'bournemouth', 'city', 'como',\n  'crystalpalace', 'inter', 'liverpool', 'manu', 'napoli', 'real', 'realbetis',\n  'roma', 'villareal'",
            "  'arsenal', 'astonvilla', 'atleti', 'barcelona', 'bournemouth', 'celtavigo',\n  'city', 'como', 'crystalpalace', 'inter', 'liverpool', 'manu', 'napoli',\n  'real', 'realbetis', 'realsociedad', 'roma', 'villareal'",
            '19-match team list');
          test = replaceChecked(test,
            "assert.equal(generated.sourceSummary.storedMatches, 755);\nassert.equal(generated.sourceSummary.matches, 643);\nassert.equal(generated.sourceSummary.excludedStoredMatches, 112);\nassert.equal(generated.sourceSummary.teams, 34);",
            "assert.equal(generated.sourceSummary.storedMatches, 793);\nassert.equal(generated.sourceSummary.matches, 681);\nassert.equal(generated.sourceSummary.excludedStoredMatches, 112);\nassert.equal(generated.sourceSummary.teams, 36);",
            'generated summary counts');
          test = replaceChecked(test,
            "assert.equal(generated.sourceSummary.domesticMatches, 631);",
            "assert.equal(generated.sourceSummary.domesticMatches, 669);",
            'active domestic count');
          test = replaceChecked(test,
            "  bvb: 1.18,\n  city: 1.113,",
            "  bvb: 1.18,\n  celtavigo: 1.18,\n  city: 1.113,",
            'Celta attack value');
          test = replaceChecked(test,
            "  realbetis: 0.9686,\n  roma: 1.017,",
            "  realbetis: 0.9686,\n  realsociedad: 0.84,\n  roma: 1.017,",
            'Sociedad attack value');
          test = replaceChecked(test,
            "assert.equal(generated.profiles.bvb.attack.overall, 1.171);\nassert.equal(generated.profiles.city.attack.vsWeaker, 1.1129);",
            "assert.equal(generated.profiles.bvb.attack.overall, 1.171);\nassert.equal(generated.profiles.celtavigo.attack.overall, 1.1571);\nassert.equal(generated.profiles.celtavigo.attack.vsStronger, 1.18);\nassert.equal(generated.profiles.celtavigo.attack.vsSimilar, 1.0569);\nassert.equal(generated.profiles.celtavigo.defense.overall, 0.9661);\nassert.equal(generated.profiles.celtavigo.defense.domestic, 0.9591);\nassert.equal(generated.profiles.celtavigo.defense.vsStronger, 0.9288);\nassert.equal(generated.profiles.city.attack.vsWeaker, 1.1129);",
            'Celta context assertions');
          test = replaceChecked(test,
            "assert.equal(generated.profiles.realbetis.defense.vsSimilar, 0.9432);\nassert.equal(generated.profiles.roma.attack.vsWeaker, 1.0533);",
            "assert.equal(generated.profiles.realbetis.defense.vsSimilar, 0.9432);\nassert.equal(generated.profiles.realsociedad.attack.overall, 0.84);\nassert.equal(generated.profiles.realsociedad.attack.vsStronger, 0.9213);\nassert.equal(generated.profiles.realsociedad.attack.vsSimilar, 1.0061);\nassert.equal(generated.profiles.realsociedad.defense.overall, 1.1259);\nassert.equal(generated.profiles.realsociedad.defense.domestic, 1.1517);\nassert.equal(generated.profiles.realsociedad.defense.vsStronger, 0.9624);\nassert.equal(generated.profiles.realsociedad.defense.vsSimilar, 0.8691);\nassert.equal(generated.profiles.roma.attack.vsWeaker, 1.0533);",
            'Sociedad context assertions');
          test = replaceChecked(test,
            "assert.equal(generated.researchQueue.length, 8);\nassert.equal(generated.researchQueue[0], 'celtavigo');",
            "assert.equal(generated.researchQueue.length, 6);\nassert.equal(generated.researchQueue[0], 'juventus');",
            'Europa queue');
          fs.writeFileSync('tests/home-advantage-model.test.js', test);

          let docs = fs.readFileSync('docs/home-advantage-model.md', 'utf8');
          docs = replaceChecked(docs,
            'The archive contains 755 verified home matches. The guaranteed-team filter currently includes 643 matches across 34 active profiles:',
            'The archive contains 793 verified home matches. The guaranteed-team filter currently includes 681 matches across 36 active profiles:',
            'documentation counts');
          docs = replaceChecked(docs,
            '- Arsenal, Aston Villa, Atlético Madrid, Barcelona, Bournemouth, Como, Crystal Palace, Internazionale, Liverpool, Manchester City, Manchester United, Napoli, Real Betis, Real Madrid, Roma, and Villarreal: 19 each;',
            '- Arsenal, Aston Villa, Atlético Madrid, Barcelona, Bournemouth, Celta Vigo, Como, Crystal Palace, Internazionale, Liverpool, Manchester City, Manchester United, Napoli, Real Betis, Real Madrid, Real Sociedad, Roma, and Villarreal: 19 each;',
            'documentation Spanish Europa counts');
          docs = replaceChecked(docs,
            'AZ Alkmaar, Bayer Leverkusen, Bournemouth, Crystal Palace, and Hoffenheim are completed guaranteed Europa League clubs, and the research queue now begins with Celta Vigo.',
            'AZ Alkmaar, Bayer Leverkusen, Bournemouth, Celta Vigo, Crystal Palace, Hoffenheim, and Real Sociedad are completed guaranteed Europa League clubs, and the research queue now begins with Juventus.',
            'documentation queue');
          docs = replaceChecked(docs,
            "Real Madrid remains below the attack ceiling and is weaker than neutral against the two similar-strength observations at `0.9119`. Real Betis scores below its overall coefficient baseline but rises above it against stronger opponents; its similar-opponent visiting-goal multiplier is `0.9432`. Villarreal reaches the domestic attack ceiling, while its similar-opponent attack residual is approximately neutral. The project keeps the historical runtime slug `villareal` for compatibility, while display text and source records use the correct club name.\n\n### France 2024/25",
            "Real Madrid remains below the attack ceiling and is weaker than neutral against the two similar-strength observations at `0.9119`. Real Betis scores below its overall coefficient baseline but rises above it against stronger opponents; its similar-opponent visiting-goal multiplier is `0.9432`. Villarreal reaches the domestic attack ceiling, while its similar-opponent attack residual is approximately neutral. The project keeps the historical runtime slug `villareal` for compatibility, while display text and source records use the correct club name.\n\n`celta-sociedad-2024-25.json` adds all 38 La Liga home matches for two guaranteed Europa League clubs, 19 per club.\n\n| Club | Domestic attack | Notable context |\n|---|---:|---:|\n| Celta Vigo | 1.1800 | Stronger opponents: 1.1800 |\n| Real Sociedad | 0.8400 | Similar opponents: 1.0061 |\n\nCelta reaches the attack ceiling but also has a positive home defensive signal, with a domestic visiting-goal multiplier of `0.9591` and `0.9288` against stronger opponents. Real Sociedad reaches the conservative attack floor overall; however, its similar-opponent attack value is neutral and its corresponding visiting-goal multiplier is `0.8691`. Neither club has weaker-opponent observations under the current coefficient snapshot.\n\n### France 2024/25",
            'Spanish Europa documentation');
          fs.writeFileSync('docs/home-advantage-model.md', docs);
          NODE
      - name: Commit finalized Spanish Europa profiles
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/generate-spain-europa-home-profiles.yml
          git add tests/home-advantage-model.test.js docs/home-advantage-model.md
          git commit -m "Finalize Spanish Europa home profiles"
          git push origin HEAD:agent/add-celta-sociedad-europa-profiles

name: Generate Spain next home profiles

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    if: github.head_ref == 'agent/add-real-betis-villarreal-home-profiles' && !contains(github.event.pull_request.head.sha, '[spain next profile snapshot]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/add-real-betis-villarreal-home-profiles
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build normalized Spanish home matches
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const vm = require('node:vm');

          (async () => {
            const response = await fetch('https://raw.githubusercontent.com/openfootball/espana/master/2024-25/1-liga.txt');
            if (!response.ok) throw new Error(`OpenFootball request failed: ${response.status}`);
            const source = await response.text();

            const coefficientContext = { window: {}, Object };
            vm.runInNewContext(fs.readFileSync('generated-club-coefficients.js', 'utf8'), coefficientContext);
            const coefficients = coefficientContext.window.UCLDRAW_CLUB_COEFFICIENTS.clubs;
            const associationFloor = 19.409;

            const teams = {
              'Athletic Club': { slug: 'athleticbilbao', name: 'Athletic Club', aliases: ['athleticbilbao'] },
              'Getafe CF': { slug: 'getafe', name: 'Getafe', aliases: ['getafe'] },
              'Real Betis Balompié': { slug: 'realbetis', name: 'Real Betis', aliases: ['realbetis'] },
              'Girona FC': { slug: 'girona', name: 'Girona', aliases: ['girona'] },
              'RC Celta de Vigo': { slug: 'celtavigo', name: 'Celta Vigo', aliases: ['celtavigo'] },
              'Deportivo Alavés': { slug: 'alaves', name: 'Alavés', aliases: ['alaves'] },
              'UD Las Palmas': { slug: 'laspalmas', name: 'Las Palmas', aliases: ['laspalmas'] },
              'Sevilla FC': { slug: 'sevilla', name: 'Sevilla', aliases: ['sevilla'] },
              'CA Osasuna': { slug: 'osasuna', name: 'Osasuna', aliases: ['osasuna'] },
              'Valencia CF': { slug: 'valencia', name: 'Valencia', aliases: ['valencia'] },
              'FC Barcelona': { slug: 'barcelona', name: 'Barcelona', aliases: ['barcelona'] },
              'Real Sociedad de Fútbol': { slug: 'realsociedad', name: 'Real Sociedad', aliases: ['realsociedad'] },
              'Rayo Vallecano de Madrid': { slug: 'rayovallecano', name: 'Rayo Vallecano', aliases: ['rayovallecano'] },
              'RCD Mallorca': { slug: 'mallorca', name: 'Mallorca', aliases: ['mallorca'] },
              'Real Madrid CF': { slug: 'real', name: 'Real Madrid', aliases: ['real'] },
              'Real Valladolid CF': { slug: 'valladolid', name: 'Real Valladolid', aliases: ['valladolid'] },
              'RCD Espanyol de Barcelona': { slug: 'espanyol', name: 'Espanyol', aliases: ['espanyol'] },
              'Villarreal CF': { slug: 'villareal', name: 'Villarreal', aliases: ['villareal'] },
              'Club Atlético de Madrid': { slug: 'atleti', name: 'Atlético Madrid', aliases: ['atleti'] },
              'CD Leganés': { slug: 'leganes', name: 'Leganés', aliases: ['leganes'] }
            };
            const targets = new Set(['real', 'realbetis', 'villareal']);
            const monthIndex = { Jan: 0, Feb: 1, Mar: 2, Apr: 3, May: 4, Jun: 5, Jul: 6, Aug: 7, Sep: 8, Oct: 9, Nov: 10, Dec: 11 };

            function coefficientFor(team) {
              for (const alias of team.aliases) {
                const value = Number(coefficients[alias]?.coefficient);
                if (Number.isFinite(value)) return value;
              }
              return associationFloor;
            }

            let currentYear = 2024;
            let previousMonth = null;
            let currentDate = null;
            const records = [];

            for (const line of source.split(/\r?\n/)) {
              const dateMatch = line.match(/^\s*(?:Mon|Tue|Wed|Thu|Fri|Sat|Sun)\s+([A-Z][a-z]{2})\s+(\d{1,2})(?:\s+(\d{4}))?\s*$/);
              if (dateMatch) {
                const month = monthIndex[dateMatch[1]];
                if (dateMatch[3]) currentYear = Number(dateMatch[3]);
                else if (previousMonth !== null && month < previousMonth - 6) currentYear += 1;
                previousMonth = month;
                currentDate = `${currentYear}-${String(month + 1).padStart(2, '0')}-${String(Number(dateMatch[2])).padStart(2, '0')}`;
                continue;
              }

              const match = line.match(/^\s*(?:\d{2}:\d{2}\s+)?(.+?)\s+v\s+(.+?)\s+(\d+)-(\d+)(?:\s+\([^)]*\))?(?:\s+\[[^\]]+\])?\s*$/);
              if (!match || !currentDate) continue;
              const home = teams[match[1].trim()];
              const away = teams[match[2].trim()];
              if (!home || !away || !targets.has(home.slug)) continue;

              records.push({
                date: currentDate,
                competitionType: 'domestic',
                competition: 'Spain Primera División 2024/25',
                homeSlug: home.slug,
                homeName: home.name,
                homeCountry: 'ESP',
                awaySlug: away.slug,
                awayName: away.name,
                awayCountry: 'ESP',
                homeCoefficient: coefficientFor(home),
                awayCoefficient: coefficientFor(away),
                homePot: 1,
                awayPot: 1,
                potCount: 1,
                homeGoals: Number(match[3]),
                awayGoals: Number(match[4]),
                sourceKey: 'openfootball-spain-2024-25'
              });
            }

            records.sort((left, right) => left.date.localeCompare(right.date) || left.homeSlug.localeCompare(right.homeSlug));
            if (records.length !== 57) throw new Error(`Expected 57 Spanish home matches, received ${records.length}.`);
            for (const slug of targets) {
              const count = records.filter((record) => record.homeSlug === slug).length;
              if (count !== 19) throw new Error(`Expected 19 ${slug} home matches, received ${count}.`);
            }

            fs.writeFileSync('data/home-advantage-matches/real-betis-villarreal-2024-25.json', `${JSON.stringify(records)}\n`);
            console.log(JSON.stringify(Object.fromEntries([...targets].map((slug) => [slug, records.filter((record) => record.homeSlug === slug).length]))));
          })().catch((error) => {
            console.error(error);
            process.exitCode = 1;
          });
          NODE
      - name: Regenerate profile payload
        run: node scripts/build-home-advantage-profiles.mjs
      - name: Commit verified Spanish profiles
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/home-advantage-matches/real-betis-villarreal-2024-25.json generated-home-advantage-profiles.js
          if ! git diff --cached --quiet; then
            git commit -m "Generate Spanish guaranteed profiles [spain next profile snapshot]"
            git push origin HEAD:agent/add-real-betis-villarreal-home-profiles
          fi

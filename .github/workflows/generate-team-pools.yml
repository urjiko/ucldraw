name: Generate team pool manifest

on:
  push:
    branches:
      - main
    paths:
      - 'crests/pools/**/*.png'
      - 'scripts/generate-team-pools.mjs'

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate pool manifest
        run: node scripts/generate-team-pools.mjs
      - name: Commit manifest when changed
        run: |
          if git diff --quiet -- generated-team-pools.js; then
            echo "Manifest already matches the crest folders."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add generated-team-pools.js
          git commit -m "Regenerate team pool manifest [skip ci]"
          git push

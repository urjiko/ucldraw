name: Finalize Champions Q3 home profiles

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  finalize:
    if: github.head_ref == 'agent/add-champions-q3-home-profiles'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/add-champions-q3-home-profiles
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Rebuild Champions Q3 home profiles
        run: node scripts/build-home-advantage-profiles.mjs
      - name: Finalize regression tests and documentation
        run: node scripts/finalize-champions-q3-home-profiles.mjs
      - name: Run home-profile regression test
        run: node tests/home-advantage-model.test.js
      - name: Commit finalized Champions Q3 profiles
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/home-advantage-model.test.js docs/home-advantage-model.md generated-home-advantage-profiles.js
          if ! git diff --cached --quiet; then
            git commit -m "Finalize Champions Q3 home profiles"
            git push origin HEAD:agent/add-champions-q3-home-profiles
          fi

name: Finalize Conference playoff home profiles

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  finalize:
    if: github.head_ref == 'agent/add-conference-playoff-home-profiles'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/add-conference-playoff-home-profiles
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Rebuild Conference playoff home profiles
        run: |
          node scripts/generate-conference-playoff-home-profiles.mjs
          node scripts/build-home-advantage-profiles.mjs
      - name: Finalize tests and documentation
        run: node scripts/finalize-conference-playoff-home-profiles.mjs
      - name: Run profile regression test
        run: node tests/home-advantage-model.test.js
      - name: Commit finalized Conference playoff profiles
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/home-advantage-model.test.js docs/home-advantage-model.md generated-home-advantage-profiles.js data/home-advantage-matches/atalanta-brighton-freiburg-getafe-monaco-2024-25.json scripts/build-home-advantage-profiles.mjs
          if ! git diff --cached --quiet; then
            git commit -m "Finalize Conference playoff home profiles"
            git push origin HEAD:agent/add-conference-playoff-home-profiles
          fi

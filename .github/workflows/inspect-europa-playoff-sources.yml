name: Generate Europa playoff home profiles

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    if: github.head_ref == 'agent/add-europa-playoff-home-profiles'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/add-europa-playoff-home-profiles
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Rebuild Europa playoff home profiles
        run: |
          node scripts/generate-europa-playoff-home-profiles.mjs
          node scripts/build-home-advantage-profiles.mjs
      - name: Finalize tests and documentation
        run: node scripts/finalize-europa-playoff-home-profiles.mjs
      - name: Run profile regression test
        run: node tests/home-advantage-model.test.js
      - name: Commit finalized Europa playoff profiles
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/home-advantage-matches/crete-lillestrom-trabzonspor-truidense-viktoriaplzen-2024-25.json scripts/build-home-advantage-profiles.mjs generated-home-advantage-profiles.js tests/home-advantage-model.test.js docs/home-advantage-model.md docs/home-advantage-sources/europa-playoffs-2024-25.md
          if ! git diff --cached --quiet; then
            git commit -m "Finalize Europa playoff home profiles"
            git push origin HEAD:agent/add-europa-playoff-home-profiles
          fi

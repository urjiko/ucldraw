name: Generate Europa playoff home profiles

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    if: github.head_ref == 'agent/add-europa-playoff-home-profiles'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/add-europa-playoff-home-profiles
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build Europa playoff home matches
        run: node scripts/generate-europa-playoff-home-profiles.mjs
      - name: Regenerate profile payload
        run: node scripts/build-home-advantage-profiles.mjs
      - name: Commit verified Europa playoff profiles
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/home-advantage-matches/crete-lillestrom-trabzonspor-truidense-viktoriaplzen-2024-25.json scripts/build-home-advantage-profiles.mjs generated-home-advantage-profiles.js
          if ! git diff --cached --quiet; then
            git commit -m "Generate Europa playoff home profiles"
            git push origin HEAD:agent/add-europa-playoff-home-profiles
          fi

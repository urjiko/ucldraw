name: Prepare league routes

on:
  push:
    branches:
      - agent/add-league-routes
    paths:
      - scripts/prepare-league-routes.mjs
      - .github/workflows/prepare-league-routes.yml

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/add-league-routes
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Prepare canonical league routes
        run: node scripts/prepare-league-routes.mjs

      - name: Validate route generation
        run: |
          node --check app-v3.js
          node --check scripts/generate-league-routes.mjs
          node scripts/generate-league-routes.mjs
          git diff --exit-code -- champions-league/index.html europa-league/index.html conference-league/index.html
          node tests/league-routes.test.js

      - name: Remove one-shot preparation files
        run: |
          rm scripts/prepare-league-routes.mjs
          rm .github/workflows/prepare-league-routes.yml

      - name: Commit route implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html app-v3.js About/index.html
          git add champions-league/index.html europa-league/index.html conference-league/index.html
          git add scripts/generate-league-routes.mjs tests/league-routes.test.js
          git add sitemap.xml robots.txt .github/workflows/static-checks.yml
          git add -u scripts/prepare-league-routes.mjs .github/workflows/prepare-league-routes.yml
          git commit -m "Add canonical league routes"
          git push origin HEAD:agent/add-league-routes

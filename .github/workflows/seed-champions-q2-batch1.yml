name: Seed Champions Q2 batch 1

on:
  push:
    branches:
      - agent/add-champions-q2-batch1
    paths:
      - scripts/seed-champions-q2-batch1.mjs
      - .github/workflows/seed-champions-q2-batch1.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/add-champions-q2-batch1
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate sourced Q2 profiles
        run: node scripts/seed-champions-q2-batch1.mjs

      - name: Validate generated data
        run: |
          node --check scripts/build-home-advantage-profiles.mjs
          node --check generated-home-advantage-profiles.js
          node tests/home-advantage-model.test.js

      - name: Remove one-shot generator
        run: |
          rm scripts/seed-champions-q2-batch1.mjs
          rm .github/workflows/seed-champions-q2-batch1.yml

      - name: Commit generated batch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/home-advantage-matches/aarhus-ararat-celje-crvenazvezda-dinamo-2024-25.json
          git add docs/home-advantage-model.md docs/home-advantage-sources/champions-q2-batch1-2024-25.md
          git add generated-home-advantage-profiles.js scripts/build-home-advantage-profiles.mjs tests/home-advantage-model.test.js
          git add -u scripts/seed-champions-q2-batch1.mjs .github/workflows/seed-champions-q2-batch1.yml
          git commit -m "Add first Champions Q2 home profiles"
          git push origin HEAD:agent/add-champions-q2-batch1

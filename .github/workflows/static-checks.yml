name: Static checks

on:
  pull_request:
  push:
    branches:
      - main
      - agent/global-matchdays-layout
      - agent/conference-branding
      - agent/fixture-display-venue-sequence
      - agent/dynamic-team-pools
      - agent/uefa-coefficients-venue-icons
      - agent/league-music-roster-search
      - agent/guaranteed-roster-replacements
      - agent/league-phase-predictions
      - agent/integrate-champions-webfonts
      - agent/svg-logos-minimal-copy

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check app-v3.js
          node --check draw-engine-v2.js
          node --check venue-sequence-v4.js
          node --check schedule-ui.js
          node --check fixture-display.js
          node --check venue-icons.js
          node --check roster-manager.js
          node --check roster-search-ui.js
          node --check league-music.js
          node --check league-routes.js
          node --check league-route-shell.js
          node --check qualification-bracket.js
          node --check prediction-engine.js
          node --check prediction-ai-controller.js
          node --check prediction-bridge.js
          node --check prediction-ui.js
          node --check prediction-header-v2.js
          node --check prediction-share.js
          node --check prediction-share-v2.js
          node --check prediction-share-v3.js
          node --check prediction-share-v4.js
          node --check prediction-share-v5.js
          node --check prediction-share-v6.js
          node --check prediction-share-v7.js
          node --check prediction-share-v8.js
          node --check prediction-share-v9.js
          node --check site-footer.js
          node --check ui-refinement-v4.js
          node --check ui-refinement-v5.js
          node --check champions-font-loader.js
          node --check interface-polish.js
          node --check branding-fixes.js
          node --check generated-team-pools.js
          node --check generated-club-coefficients.js
          node --check generated-home-advantage-profiles.js
          node --check team-pool-loader.js
          node --check coefficient-pots.js
          node --check scripts/generate-team-pools.mjs
          node --check scripts/generate-league-routes.mjs
          node --check scripts/update-uefa-coefficients.mjs
          node --check scripts/stabilize-coefficient-snapshot.mjs
          node --check scripts/build-home-advantage-profiles.mjs
      - name: Check generated team pools and coefficients
        run: |
          node scripts/generate-team-pools.mjs
          git diff --exit-code -- generated-team-pools.js
          node tests/qualification-bracket.test.js
          node tests/team-pools.test.js
          node tests/coefficient-pots.test.js
          node tests/uefa-coefficients.test.mjs
          node tests/generated-coefficients.test.js
          node tests/roster-manager.test.js
      - name: Check generated home advantage profiles
        run: |
          node scripts/build-home-advantage-profiles.mjs
          git diff --exit-code -- generated-home-advantage-profiles.js
          node tests/home-advantage-model.test.js
      - name: Check base HTML and controls
        run: |
          node tests/ui-v3.test.js
          node tests/ui-v4.test.js
          node tests/branding.test.js
          node tests/fixture-display.test.js
          node tests/venue-icons.test.js
          node tests/svg-minimal-ui.test.js
          node tests/share-card-v6-header-v2.test.js
          node tests/ui-refinement-v4.test.js
          node tests/header-lock-share-v7.test.js
          node tests/prediction-export-v9.test.js
          node scripts/generate-league-routes.mjs
          git diff --exit-code -- champions-league/index.html europa-league/index.html conference-league/index.html
          node tests/league-routes.test.js
      - name: Check existing music roster and prediction controls
        run: |
          node tests/music-roster-ui.test.js
          node tests/prediction-ui.test.js
          node tests/prediction-share.test.js
          node tests/prediction-share-v2.test.js
          node tests/prediction-share-v3.test.js
          node tests/explicit-match-lock.test.js
      - name: Check Champions regular part 1
        run: node tests/champions-font-part.test.js regular 1 6000
      - name: Check Champions regular part 2
        run: node tests/champions-font-part.test.js regular 2 6000
      - name: Check Champions regular part 3
        run: node tests/champions-font-part.test.js regular 3 6000
      - name: Check Champions regular part 4
        run: node tests/champions-font-part.test.js regular 4 4936
      - name: Check Champions regular font bytes
        run: node tests/champions-font.test.js regular
      - name: Check Champions bold font bytes
        run: node tests/champions-font.test.js bold
      - name: Check Champions font UI integration
        run: node tests/champions-font.test.js ui
      - name: Run draw and prediction simulations
        run: |
          node tests/draw-engine.test.js
          node tests/matchday-schedule.test.js
          node tests/venue-sequence.test.js
          node tests/prediction-engine.test.js

name: Update UEFA club coefficients

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/update-uefa-coefficients.mjs'
      - 'scripts/stabilize-coefficient-snapshot.mjs'
      - 'team-pool-loader.js'
      - 'generated-team-pools.js'
      - '.github/workflows/update-uefa-coefficients.yml'
  push:
    branches:
      - main
      - agent/uefa-coefficients-venue-icons
    paths:
      - 'scripts/update-uefa-coefficients.mjs'
      - 'scripts/stabilize-coefficient-snapshot.mjs'
      - 'team-pool-loader.js'
      - 'generated-team-pools.js'
      - '.github/workflows/update-uefa-coefficients.yml'

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    outputs:
      update_outcome: ${{ steps.update.outcome }}
      update_error: ${{ steps.update.outputs.error }}
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref_name }}
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build coefficient snapshot
        id: update
        continue-on-error: true
        shell: bash
        run: |
          set +e
          node scripts/update-uefa-coefficients.mjs 2>&1 | tee coefficient-update.log
          status=${PIPESTATUS[0]}
          if [ "$status" -eq 0 ]; then
            node scripts/stabilize-coefficient-snapshot.mjs
            status=$?
          fi
          error=$(grep -m 1 'Error:' coefficient-update.log || tail -n 1 coefficient-update.log)
          error=$(printf '%s' "$error" | tr '\n\r' ' ' | sed 's/%/%25/g; s/\r/%0D/g; s/\n/%0A/g')
          echo "error=$error" >> "$GITHUB_OUTPUT"
          exit "$status"
      - name: Commit coefficient snapshot when changed
        if: steps.update.outcome == 'success'
        run: |
          if git diff --quiet -- generated-club-coefficients.js; then
            echo "Coefficient snapshot already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add generated-club-coefficients.js
          git commit -m "Update UEFA club coefficients"
          git push origin HEAD:${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref_name }}

  report-failure:
    needs: update
    if: always() && needs.update.outputs.update_outcome == 'failure'
    runs-on: ubuntu-latest
    steps:
      - name: Report coefficient update failure
        run: |
          echo "${{ needs.update.outputs.update_error }}"
          exit 1

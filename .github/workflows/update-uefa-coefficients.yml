name: Update UEFA club coefficients

on:
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * 1'
  pull_request:
    paths:
      - 'scripts/update-uefa-coefficients.mjs'
      - 'team-pool-loader.js'
      - 'generated-team-pools.js'
      - '.github/workflows/update-uefa-coefficients.yml'
  push:
    branches:
      - main
      - agent/uefa-coefficients-venue-icons
    paths:
      - 'scripts/update-uefa-coefficients.mjs'
      - 'team-pool-loader.js'
      - 'generated-team-pools.js'
      - '.github/workflows/update-uefa-coefficients.yml'

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    outputs:
      scrape_outcome: ${{ steps.scrape.outcome }}
      scrape_error: ${{ steps.scrape.outputs.error }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Set up Chrome
        uses: browser-actions/setup-chrome@v1
      - name: Install browser client
        run: npm install --silent --no-save --no-package-lock puppeteer-core@24
      - name: Read official UEFA coefficients
        id: scrape
        continue-on-error: true
        shell: bash
        run: |
          set +e
          node scripts/update-uefa-coefficients.mjs 2>&1 | tee uefa-update.log
          status=${PIPESTATUS[0]}
          error=$(grep -m 1 'Error:' uefa-update.log || tail -n 1 uefa-update.log)
          error=$(printf '%s' "$error" | tr '\n\r' ' ' | sed 's/%/%25/g; s/\r/%0D/g; s/\n/%0A/g')
          echo "error=$error" >> "$GITHUB_OUTPUT"
          exit "$status"
      - name: Commit coefficient snapshot when changed
        if: steps.scrape.outcome == 'success' && github.event_name != 'pull_request'
        run: |
          if git diff --quiet -- generated-club-coefficients.js; then
            echo "Coefficient snapshot already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add generated-club-coefficients.js
          git commit -m "Update UEFA club coefficients [skip ci]"
          git push

  report-failure:
    needs: update
    if: always() && needs.update.outputs.scrape_outcome == 'failure'
    runs-on: ubuntu-latest
    steps:
      - name: Report scraper failure
        run: |
          echo "${{ needs.update.outputs.scrape_error }}"
          exit 1

name: Venue sequence check

on:
  pull_request:

permissions:
  contents: read

jobs:
  venue-sequence:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run venue sequence solver
        id: venue
        continue-on-error: true
        run: node tests/venue-sequence.test.js > venue-result.txt 2>&1
      - name: Upload venue diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: venue-result
          path: |
            venue-result.txt
            teams.js
            draw-engine-v2.js
            venue-sequence-v4.js
            tests/venue-sequence.test.js
      - name: Fail when solver fails
        if: steps.venue.outcome == 'failure'
        run: exit 1

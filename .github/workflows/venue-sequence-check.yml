name: Venue sequence check

on:
  pull_request:

permissions:
  contents: read

jobs:
  venue-sequence:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check venue sequence solver
        run: node tests/venue-sequence.test.js

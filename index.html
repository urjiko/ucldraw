<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#022ae2">
  <meta name="description" content="UEFA Champions League, Europa League ve Conference League için interaktif lig aşaması kura simülatörü.">
  <title>UEFA Draw Simulator</title>
  <link rel="icon" type="image/png" href="crests/pools/uefa_logo.png">
  <link rel="shortcut icon" type="image/png" href="crests/pools/uefa_logo.png">
  <link rel="apple-touch-icon" href="crests/pools/uefa_logo.png">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="fixes.css">
  <link rel="stylesheet" href="v3.css">
  <link rel="stylesheet" href="v4.css">
  <link rel="stylesheet" href="branding-fixes.css">
  <link rel="stylesheet" href="fixture-display.css">
  <link rel="stylesheet" href="venue-icons.css">
  <link rel="stylesheet" href="roster-search.css">
  <link rel="stylesheet" href="league-music.css">
  <link rel="stylesheet" href="prediction.css">
  <link rel="stylesheet" href="prediction-share.css">
  <link rel="stylesheet" href="prediction-share-v2.css">
  <link rel="stylesheet" href="prediction-share-v3.css">
  <link rel="stylesheet" href="prediction-share-v4.css">
  <link rel="stylesheet" href="champions-font.css">
  <link rel="stylesheet" href="interface-polish.css">
  <link rel="stylesheet" href="minimal-copy-v2.css">
  <link rel="stylesheet" href="prediction-header-v2.css">
  <link rel="stylesheet" href="site-footer.css">
</head>
<body data-league="ucl">
  <main class="app-shell" id="app">
    <header class="app-header" id="appHeader">
      <div class="brand-row">
        <div class="brand-lockup">
          <div class="brand-mark" id="brandMark" aria-hidden="true"></div>
          <div class="brand-copy">
            <h1 id="brandTitle">UEFA Draw Simulator</h1>
            <p id="brandSubtitle">Kurayı çek, sonuçları tahmin et.</p>
          </div>
        </div>
        <div class="rules-chip" id="rulesChip" aria-hidden="true"></div>
      </div>
      <nav class="competition-picker" id="competitionPicker" aria-label="Turnuva seçimi"></nav>
    </header>

    <section class="selection-screen" id="selectionScreen">
      <div class="selection-toolbar glass">
        <div class="search-wrap">
          <span class="search-icon" aria-hidden="true">⌕</span>
          <input class="team-search" id="teamSearch" type="search" autocomplete="off" placeholder="Takım Ara..." aria-label="Takım Ara" aria-controls="searchResults" aria-expanded="false">
          <ul class="search-results" id="searchResults" hidden></ul>
        </div>
      </div>
      <div class="pot-grid" id="selectionPots"></div>
    </section>

    <section class="draw-screen" id="drawScreen" hidden>
      <div class="draw-topbar glass">
        <div class="draw-topbar-copy">
          <div class="draw-kicker" id="drawKicker">Kura</div>
          <div class="draw-title" id="drawTitle">Takım seçilmedi</div>
        </div>
        <div class="progress-track" aria-label="Kura ilerlemesi">
          <div class="progress-bar" id="progressBar"></div>
        </div>
      </div>

      <div class="draw-stage">
        <aside class="draw-side left" id="leftPots" aria-label="Sol torbalar"></aside>
        <section class="draw-center glass">
          <div class="selected-club-card" id="selectedClubCard"></div>

          <section class="draw-control-panel glass draw-control-panel-inline" id="drawControlPanel" aria-label="Kura kontrolü">
            <div class="control-group">
              <span class="control-label">Mod</span>
              <div class="segmented-control" id="modeControl">
                <button type="button" class="control-chip is-active" data-control-mode="auto">Otomatik</button>
                <button type="button" class="control-chip" data-control-mode="manual">Manuel</button>
              </div>
            </div>
            <div class="control-group" id="speedControlGroup">
              <span class="control-label">Hız</span>
              <div class="segmented-control" id="speedControl">
                <button type="button" class="control-chip is-active" data-speed="1">1×</button>
                <button type="button" class="control-chip" data-speed="1.5">1.5×</button>
                <button type="button" class="control-chip" data-speed="2">2×</button>
              </div>
            </div>
            <div class="manual-control" id="manualControl" hidden>
              <button type="button" class="manual-select-button" id="manualSelectButton">Seç</button>
              <div class="manual-countdown" id="manualCountdown" aria-live="polite">Hazır</div>
            </div>
            <button type="button" class="finish-all-button" id="finishAllButton">Kurayı Tamamla</button>
          </section>

          <div class="draw-status" id="drawStatus" aria-live="polite">Hazırlanıyor...</div>
          <div class="custom-note" id="customNote" hidden>Maçı seç, sonra rakibi belirle.</div>
          <div class="pair-controls" id="pairControls" hidden></div>
          <div class="fixture-list" id="fixtureList"></div>
          <div class="draw-actions" id="drawActions" hidden>
            <button class="action-button primary" id="retryButton" type="button">Yeni Kura</button>
            <button class="action-button" id="showOverviewButton" type="button">Tüm Maçlar</button>
            <button class="action-button" id="customizeButton" type="button">Kurayı Düzenle</button>
            <button class="action-button" id="changeTeamButton" type="button">Başa Dön</button>
          </div>
          <div class="custom-actions" id="customActions" hidden>
            <button class="action-button primary" id="finishCustomButton" type="button">Kurayı Tamamla</button>
            <button class="action-button" id="resetCustomButton" type="button">Sıfırla</button>
            <button class="action-button danger" id="cancelCustomButton" type="button">Vazgeç</button>
          </div>
        </section>
        <aside class="draw-side right" id="rightPots" aria-label="Sağ torbalar"></aside>
      </div>

      <section class="all-fixtures-section glass" id="allFixturesSection" hidden>
        <header class="all-fixtures-header">
          <h2>Tüm Maçlar</h2>
          <button type="button" class="action-button" id="hideOverviewButton">Gizle</button>
        </header>
        <div class="all-fixtures-grid" id="allFixturesGrid"></div>
      </section>
    </section>
  </main>

  <div class="modal-backdrop" id="confirmBackdrop" hidden>
    <section class="confirm-modal glass mode-modal" role="dialog" aria-modal="true" aria-labelledby="confirmTitle" aria-describedby="confirmText">
      <div id="confirmCrest"></div>
      <h2 id="confirmTitle">Kura hazır</h2>
      <p id="confirmText">Kura modunu seç.</p>
      <fieldset class="mode-choice-fieldset">
        <legend>Mod</legend>
        <div class="mode-choice-grid" id="initialModeChoice">
          <button type="button" class="mode-choice-card is-selected" data-initial-mode="auto">
            <strong>Otomatik</strong>
            <span>Kura otomatik ilerler.</span>
          </button>
          <button type="button" class="mode-choice-card" data-initial-mode="manual">
            <strong>Manuel</strong>
            <span>Her seçimde sen durdurursun.</span>
          </button>
        </div>
      </fieldset>
      <div class="initial-speed" id="initialSpeedControl">
        <span>Hız</span>
        <div class="segmented-control">
          <button type="button" class="control-chip is-active" data-initial-speed="1">1×</button>
          <button type="button" class="control-chip" data-initial-speed="1.5">1.5×</button>
          <button type="button" class="control-chip" data-initial-speed="2">2×</button>
        </div>
      </div>
      <div class="modal-actions">
        <button class="action-button" id="cancelConfirmButton" type="button">Geri</button>
        <button class="action-button primary" id="confirmDrawButton" type="button">Başlat</button>
      </div>
    </section>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="font-data/champions-regular-1.js"></script>
  <script src="font-data/champions-regular-2.js"></script>
  <script src="font-data/champions-regular-3.js"></script>
  <script src="font-data/champions-regular-4.js"></script>
  <script src="font-data/champions-bold-1.js"></script>
  <script src="font-data/champions-bold-2.js"></script>
  <script src="font-data/champions-bold-3.js"></script>
  <script src="font-data/champions-bold-4.js"></script>
  <script src="champions-font-loader.js"></script>
  <script src="teams.js"></script>
  <script src="generated-team-pools.js"></script>
  <script src="generated-club-coefficients.js"></script>
  <script src="qualification-bracket.js"></script>
  <script src="team-pool-loader.js"></script>
  <script src="coefficient-pots.js"></script>
  <script src="roster-manager.js"></script>
  <script src="branding-fixes.js"></script>
  <script src="draw-engine-v2.js"></script>
  <script src="prediction-engine.js"></script>
  <script src="prediction-ai-controller.js"></script>
  <script src="prediction-bridge.js"></script>
  <script src="venue-sequence-v4.js"></script>
  <script src="app-v3.js"></script>
  <script src="schedule-ui.js"></script>
  <script src="fixture-display.js"></script>
  <script src="venue-icons.js"></script>
  <script src="roster-search-ui.js"></script>
  <script src="league-music.js"></script>
  <script src="prediction-ui.js"></script>
  <script src="interface-polish.js"></script>
  <script src="prediction-header-v2.js"></script>
  <script src="ui-refinement-v4.js"></script>
  <script src="ui-refinement-v5.js"></script>
  <script src="prediction-share.js"></script>
  <script src="prediction-share-v2.js"></script>
  <script src="prediction-share-v3.js"></script>
  <script src="prediction-share-v4.js"></script>
  <script src="prediction-share-v5.js"></script>
  <script src="prediction-share-v6.js"></script>
  <script src="prediction-share-v7.js" data-prediction-share-v7="true"></script>
  <script src="site-footer.js"></script>
</body>
</html>
